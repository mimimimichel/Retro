<title>Retro Live</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@600;800&display=swap">
<style>
/* Layout: a team workshop wall. Navy header band with the step rail and timer, a dotted wall of tilted sticky notes, the facilitator console floating as a dock at the bottom. */
:root {
  --wall: #eef0fb;
  --dot: #d5d9f0;
  --surface: #ffffff;
  --ink: #1b1f45;
  --muted: #5f6488;
  --line: #dcdff2;
  --band: #1f2466;
  --band-ink: #f4f5ff;
  --accent: #4b4ff0;
  --accent-ink: #ffffff;
  --accent-soft: #e4e5ff;
  --pop: #ff4f8b;
  --pop-ink: #ffffff;
  --n1: #ffe56b; --n2: #ffb3cf; --n3: #a8ecc4; --n4: #a9d4ff; --n5: #d4c2ff;
  --note-ink: #26222f;
  --tape: rgba(255,255,255,.55);
  --good: #17a45b; --warn: #e08a00; --bad: #e0344f;
  --sky: #d7e8ff; --sea: #a9d8ea; --sand: #f5e3b5; --grass: #c4e8b5; --road: #d3d7e4;
  --night1: #efe7ff; --night2: #d6c8ff; --warm1: #ffe4ec; --warm2: #fff0d4; --gridline: rgba(75, 79, 240, .11);
  --shadow: 0 1px 2px rgba(27,31,69,.10), 0 10px 20px -10px rgba(27,31,69,.35);
  --shadow-lift: 0 2px 4px rgba(27,31,69,.12), 0 18px 30px -12px rgba(27,31,69,.45);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-note: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --wall: #12152f; --dot: #22274d; --surface: #1b1f45; --ink: #eceeff; --muted: #a3a8d0; --line: #2d3266;
  --band: #0c0f26; --band-ink: #eceeff; --accent: #8c8fff; --accent-ink: #0f1233; --accent-soft: #2a2f6b;
  --pop: #ff6f9f; --pop-ink: #1a0b14;
  --n1: #f2d95f; --n2: #f2a3c0; --n3: #98dcb4; --n4: #9cc6f2; --n5: #c2b0f2;
  --note-ink: #1f1b28; --tape: rgba(255,255,255,.35);
  --good: #4fd18a; --warn: #ffb547; --bad: #ff6b80;
  --sky: #1c2a56; --sea: #123a52; --sand: #3b3321; --grass: #1d3b28; --road: #2a2e45;
  --night1: #30276a; --night2: #15112f; --warm1: #3a2032; --warm2: #352f1d; --gridline: rgba(140, 143, 255, .13);
  --shadow: 0 1px 2px rgba(0,0,0,.45), 0 12px 24px -12px rgba(0,0,0,.75);
  --shadow-lift: 0 2px 4px rgba(0,0,0,.5), 0 20px 34px -12px rgba(0,0,0,.85);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --wall: #12152f; --dot: #22274d; --surface: #1b1f45; --ink: #eceeff; --muted: #a3a8d0; --line: #2d3266;
  --band: #0c0f26; --band-ink: #eceeff; --accent: #8c8fff; --accent-ink: #0f1233; --accent-soft: #2a2f6b;
  --pop: #ff6f9f; --pop-ink: #1a0b14;
  --n1: #f2d95f; --n2: #f2a3c0; --n3: #98dcb4; --n4: #9cc6f2; --n5: #c2b0f2;
  --note-ink: #1f1b28; --tape: rgba(255,255,255,.35);
  --good: #4fd18a; --warn: #ffb547; --bad: #ff6b80;
  --sky: #1c2a56; --sea: #123a52; --sand: #3b3321; --grass: #1d3b28; --road: #2a2e45;
  --night1: #30276a; --night2: #15112f; --warm1: #3a2032; --warm2: #352f1d; --gridline: rgba(140, 143, 255, .13);
  --shadow: 0 1px 2px rgba(0,0,0,.45), 0 12px 24px -12px rgba(0,0,0,.75);
  --shadow-lift: 0 2px 4px rgba(0,0,0,.5), 0 20px 34px -12px rgba(0,0,0,.85);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--wall);
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.4px);
  background-size: 24px 24px;
  color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  min-height: 100vh;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--band); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--pop); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.1; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1340px; margin: 0 auto; }

/* Header band */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--band); color: var(--band-ink); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 12px 10px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 220px; }
.logo { width: 38px; height: 38px; flex: none; position: relative; }
.logo i { position: absolute; width: 24px; height: 24px; border-radius: 3px 3px 8px 3px; }
.logo i:nth-child(1) { background: var(--n1); left: 0; top: 2px; transform: rotate(-10deg); }
.logo i:nth-child(2) { background: var(--n2); left: 8px; top: 8px; transform: rotate(4deg); }
.logo i:nth-child(3) { background: var(--n3); left: 14px; top: 13px; transform: rotate(12deg); }
.brand-text { min-width: 0; }
.brand h1 { font-size: 1.3rem; font-weight: 800; letter-spacing: -.01em; overflow-wrap: anywhere; }
.brand small { color: color-mix(in srgb, var(--band-ink) 70%, transparent); font-size: .82rem; }
.brand .link { color: var(--pop); }
.timer { font-family: var(--f-mono); font-weight: 800; font-size: 1.4rem; font-variant-numeric: tabular-nums; padding: 5px 14px; border-radius: 999px; background: color-mix(in srgb, var(--band-ink) 10%, transparent); min-width: 104px; text-align: center; letter-spacing: .02em; }
.timer.idle { opacity: .55; font-size: 1.05rem; }
.timer.low { background: var(--warn); color: #1b1300; }
.timer.over { background: var(--bad); color: #fff; animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.people { display: flex; align-items: center; gap: 8px; }
.avs { display: flex; }
.avs .av { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--band); margin-left: -9px; background: var(--accent); object-fit: cover; display: block; }
.avs .av:first-child { margin-left: 0; }
.people span.n { font-size: .82rem; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.people span.n::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 30%, transparent); }
.steps { display: flex; gap: 6px; overflow-x: auto; flex: 1 1 100%; padding: 2px 0 4px; scrollbar-width: none; }
.steps::-webkit-scrollbar { display: none; }
.step { display: flex; align-items: center; gap: 7px; border: 0; background: color-mix(in srgb, var(--band-ink) 8%, transparent); border-radius: 999px; padding: 4px 13px 4px 4px; font-size: .84rem; font-weight: 600; color: color-mix(in srgb, var(--band-ink) 65%, transparent); white-space: nowrap; cursor: default; }
.step b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: .74rem; background: color-mix(in srgb, var(--band-ink) 14%, transparent); font-variant-numeric: tabular-nums; }
.step.past { color: var(--band-ink); }
.step.past b { background: var(--good); color: #fff; }
.step.now { background: var(--pop); color: var(--pop-ink); }
.step.now b { background: var(--pop-ink); color: var(--pop); }
.step.click { cursor: pointer; }
.step.click:hover:not(.now) { background: color-mix(in srgb, var(--band-ink) 18%, transparent); }
.tbar { height: 4px; background: color-mix(in srgb, var(--band-ink) 10%, transparent); }
.tbar i { display: block; height: 100%; background: var(--pop); width: 0; transition: width .5s linear; }

/* Main */
main.wrap { padding-block: 26px 150px; display: flex; flex-direction: column; gap: 22px; }
.phase-head { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; }
.bignum { font-family: var(--f-display); font-weight: 800; font-size: clamp(3.4rem, 7vw, 5rem); line-height: .85; color: transparent; -webkit-text-stroke: 2px var(--accent); flex: none; }
.phase-head .txt { flex: 1 1 300px; min-width: 0; }
.phase-head h2 { font-size: clamp(1.6rem, 3.4vw, 2.3rem); font-weight: 800; letter-spacing: -.02em; }
.phase-head p { margin: 6px 0 0; color: var(--muted); max-width: 64ch; font-size: 1rem; }
.eyebrow { text-transform: uppercase; letter-spacing: .1em; font-size: .72rem; font-weight: 800; color: var(--pop); }
.banner { border-radius: var(--r); padding: 11px 16px; font-size: .92rem; background: var(--surface); border: 2px solid var(--warn); }
.banner.info { border-color: var(--accent); }
.panel { background: var(--surface); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); }

.btn { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 16px; font-weight: 700; font-size: .9rem; display: inline-flex; align-items: center; gap: 6px; transition: transform .12s ease, border-color .12s ease, background .12s ease; }
.btn:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 55%, #000); }
.btn.primary:active:not(:disabled) { box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 55%, #000); transform: translateY(3px); }
.btn.big { padding: 12px 26px; font-size: 1.05rem; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 3px 11px; font-size: .8rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; font-size: .85rem; text-decoration: underline; text-underline-offset: 3px; }
.field { width: 100%; border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; }
.field:focus { border-color: var(--accent); outline: none; }
label.lbl { display: block; font-size: .8rem; font-weight: 700; color: var(--muted); margin-bottom: 5px; }

/* Setup */
.hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px; align-items: center; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } .hero .stack { display: none; } }
.hero h2 { font-size: clamp(2.2rem, 5.5vw, 3.8rem); font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.hero h2 em { font-style: normal; color: var(--pop); }
.hero p { color: var(--muted); font-size: 1.05rem; max-width: 52ch; margin: 12px 0 0; }
.stack { position: relative; height: 210px; }
.stack .note { position: absolute; width: 170px; }
.stack .note:nth-child(1) { left: 6%; top: 14px; transform: rotate(-6deg); --note: var(--n1); }
.stack .note:nth-child(2) { left: 38%; top: 0; transform: rotate(4deg); --note: var(--n2); }
.stack .note:nth-child(3) { left: 22%; top: 96px; transform: rotate(-1deg); --note: var(--n3); }
.methods { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 285px), 1fr)); gap: 14px; }
.method { text-align: left; background: var(--surface); border: 3px solid transparent; border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 9px; min-width: 0; box-shadow: var(--shadow); transition: transform .15s ease, box-shadow .15s ease; }
.method:hover { transform: translateY(-3px) rotate(-.4deg); box-shadow: var(--shadow-lift); }
.method.sel { border-color: var(--accent); }
.method.sel h3::after { content: "Selected"; font-family: var(--f-body); font-size: .68rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); padding: 2px 8px; border-radius: 999px; margin-left: 8px; vertical-align: middle; }
.method h3 { font-size: 1.15rem; font-weight: 800; }
.method p { margin: 0; font-size: .9rem; color: var(--muted); }
.method .best { font-size: .8rem; font-weight: 600; color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--f-note); font-size: 1.05rem; font-weight: 700; padding: 0 9px; border-radius: 3px 3px 7px 3px; background: var(--c); color: var(--note-ink); line-height: 1.5; }
.chip:nth-child(odd) { transform: rotate(-2deg); }
.chip:nth-child(even) { transform: rotate(1.5deg); }
.setup-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
.setup-row > div { flex: 1 1 220px; min-width: 0; }

/* Board */
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 255px), 1fr)); gap: 16px; align-items: start; }
.col { background: color-mix(in srgb, var(--surface) 72%, transparent); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 14px; min-width: 0; border: 2px dashed color-mix(in srgb, var(--note) 70%, var(--line)); }
.col > header { display: flex; gap: 10px; align-items: center; }
.col .badge { width: 36px; height: 36px; border-radius: 10px; background: var(--note); color: var(--note-ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; flex: none; transform: rotate(-4deg); box-shadow: var(--shadow); }
.col > header div { flex: 1; min-width: 0; }
.col h3 { font-size: 1.15rem; font-weight: 800; }
.col header p { margin: 0; color: var(--muted); font-size: .82rem; line-height: 1.3; }
.count { font-family: var(--f-mono); font-size: .78rem; font-weight: 800; color: var(--note-ink); background: var(--note); padding: 1px 8px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.notes { display: flex; flex-direction: column; gap: 14px; }
.note { --tilt: 0deg; position: relative; background: var(--note); color: var(--note-ink); border-radius: 2px 2px 16px 2px; padding: 16px 14px 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; min-width: 0; transform: rotate(var(--tilt)); transition: transform .18s ease, box-shadow .18s ease; }
.note::before { content: ""; position: absolute; top: -9px; left: 50%; width: 64px; height: 18px; margin-left: -32px; background: var(--tape); transform: rotate(-3deg); border-radius: 2px; box-shadow: 0 1px 1px rgba(0,0,0,.06); }
.notes > .note:nth-child(3n+1) { --tilt: -1.3deg; }
.notes > .note:nth-child(3n+2) { --tilt: .9deg; }
.notes > .note:nth-child(3n) { --tilt: -.4deg; }
.notes > .note:hover { transform: rotate(0deg) translateY(-2px) scale(1.01); box-shadow: var(--shadow-lift); }
.note.pop { animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) backwards; }
@keyframes pop { from { transform: scale(.6) rotate(-8deg); opacity: 0; } to { transform: rotate(var(--tilt)); opacity: 1; } }
.note .txt { font-family: var(--f-note); font-size: 1.42rem; font-weight: 500; line-height: 1.12; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.note.mine { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--note-ink) 22%, transparent), var(--shadow); }
.note.sel { box-shadow: 0 0 0 4px var(--accent), var(--shadow-lift); }
.note.target { cursor: pointer; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 55%, transparent), var(--shadow); }
.note.hidden { min-height: 74px; justify-content: center; background: repeating-linear-gradient(-45deg, var(--note), var(--note) 10px, color-mix(in srgb, var(--note) 85%, #fff) 10px, color-mix(in srgb, var(--note) 85%, #fff) 20px); }
.note.hidden .bars { display: flex; flex-direction: column; gap: 7px; }
.note.hidden .bars i { display: block; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--note-ink) 20%, transparent); }
.note.hidden small { font-size: .76rem; font-weight: 700; opacity: .7; }
.note footer { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; justify-content: space-between; }
.note footer .acts { display: flex; gap: 4px; flex-wrap: wrap; }
.nbtn { background: color-mix(in srgb, var(--note-ink) 10%, transparent); color: var(--note-ink); border: 0; border-radius: 999px; padding: 2px 10px; font-size: .76rem; font-weight: 700; }
.nbtn:hover { background: color-mix(in srgb, var(--note-ink) 20%, transparent); }
.nbtn.strong { background: var(--note-ink); color: var(--note); }
.child { border-top: 2px dotted color-mix(in srgb, var(--note-ink) 30%, transparent); padding-top: 6px; display: flex; gap: 6px; align-items: flex-start; }
.child p { margin: 0; flex: 1; font-family: var(--f-note); font-size: 1.2rem; line-height: 1.1; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.tag { font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; opacity: .6; }
.votes { display: flex; align-items: center; gap: 5px; }
.votes .dots { display: flex; gap: 3px; min-width: 14px; }
.votes .dots i { width: 11px; height: 11px; border-radius: 50%; background: var(--pop); box-shadow: 0 0 0 1.5px var(--note-ink); }
.vbtn { width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--note-ink); color: var(--note); font-weight: 800; font-size: 1.05rem; line-height: 1; display: grid; place-items: center; transition: transform .1s; }
.vbtn:hover:not(:disabled) { transform: scale(1.12); }
.vbtn:disabled { opacity: .22; cursor: not-allowed; }
.vtotal { font-family: var(--f-mono); font-weight: 800; font-size: .85rem; background: var(--pop); color: var(--pop-ink); border-radius: 999px; padding: 2px 10px; font-variant-numeric: tabular-nums; }
.add { display: flex; flex-direction: column; gap: 7px; }
.add textarea { resize: vertical; min-height: 66px; font-family: var(--f-note); font-size: 1.3rem; line-height: 1.15; border-style: dashed; background: color-mix(in srgb, var(--note) 22%, var(--surface)); }
.note textarea { resize: vertical; min-height: 66px; font-family: var(--f-note); font-size: 1.3rem; line-height: 1.15; background: color-mix(in srgb, #fff 55%, var(--note)); color: var(--note-ink); border: 1px solid color-mix(in srgb, var(--note-ink) 30%, transparent); border-radius: 6px; padding: 6px 8px; width: 100%; }
.add .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.add .hint { font-size: .74rem; color: var(--muted); }
.statusbar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; background: var(--surface); border-radius: 999px; padding: 8px 10px 8px 20px; box-shadow: var(--shadow); }
@media (max-width: 600px) { .statusbar { border-radius: var(--r); } }
.statusbar .grow { flex: 1; }
.meter { display: flex; align-items: center; gap: 10px; font-size: .9rem; font-weight: 600; }
.meter .track { width: 120px; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.meter .track i { display: block; height: 100%; background: var(--good); border-radius: 5px; transition: width .3s ease; }
.vleft { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
.vleft .dots { display: flex; gap: 4px; }
.vleft .dots i { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid var(--pop); }
.vleft .dots i.on { background: var(--pop); }

/* Check-in */
.weather { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 12px; }
.wbtn { background: var(--surface); border: 3px solid transparent; border-radius: var(--r); padding: 18px 8px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; box-shadow: var(--shadow); transition: transform .15s ease; }
.wbtn .ico { font-size: 2.8rem; line-height: 1; transition: transform .2s cubic-bezier(.2, 1.6, .4, 1); }
.wbtn:hover:not(:disabled) .ico { transform: scale(1.18) rotate(-6deg); }
.wbtn .nm { font-weight: 700; font-size: .95rem; }
.wbtn .ct { font-family: var(--f-mono); font-size: .8rem; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.wbtn .bar { width: 70%; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.wbtn .bar i { display: block; height: 100%; background: var(--accent); }
.wbtn.sel { border-color: var(--accent); transform: translateY(-3px); }

/* Discussion */
.discuss { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 880px) { .discuss { grid-template-columns: 1fr; } }
.focus { display: flex; flex-direction: column; gap: 16px; }
.focus .note { padding: 26px 24px 16px; transform: rotate(-.8deg); }
.focus .note .txt { font-size: 2.1rem; }
.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rank li { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 12px; padding: 9px 12px; min-width: 0; box-shadow: var(--shadow); border: 2px solid transparent; }
.rank li.cur { border-color: var(--pop); }
.rank li.done { opacity: .55; }
.rank li.done .t { text-decoration: line-through; }
.rank .pos { font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; color: var(--accent); width: 24px; text-align: center; font-variant-numeric: tabular-nums; }
.rank .sw { width: 12px; height: 28px; border-radius: 3px; background: var(--note); flex: none; transform: rotate(-4deg); }
.rank .t { flex: 1; min-width: 0; font-size: .93rem; font-weight: 500; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.rank .v { font-family: var(--f-mono); font-weight: 800; font-size: .82rem; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums; }

/* Actions */
.actform { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 10px; align-items: end; }
@media (max-width: 720px) { .actform { grid-template-columns: 1fr 1fr; } .actform > :first-child { grid-column: 1 / -1; } }
.alist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.alist li { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; background: var(--surface); flex-wrap: wrap; box-shadow: var(--shadow); }
.alist li.done .at { text-decoration: line-through; color: var(--muted); }
.alist .at { flex: 1 1 200px; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.alist .meta { font-size: .8rem; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; }
.alist input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--good); }
.empty { color: var(--muted); font-size: .92rem; padding: 18px; border: 2px dashed var(--line); border-radius: 12px; text-align: center; }

/* ROTI */
.roti { display: flex; flex-wrap: wrap; gap: 10px; }
.rbtn { flex: 1 1 120px; background: var(--surface); border: 3px solid transparent; border-radius: var(--r); padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: var(--shadow); transition: transform .15s ease; }
.rbtn:hover:not(:disabled) { transform: translateY(-3px); }
.rbtn b { font-family: var(--f-display); font-size: 2.2rem; font-weight: 800; line-height: 1; }
.rbtn span { font-size: .78rem; font-weight: 600; color: var(--muted); text-align: center; }
.rbtn.sel { border-color: var(--pop); }
.rbtn.sel b { color: var(--pop); }
.dist { display: grid; grid-template-columns: auto 1fr auto; gap: 7px 10px; align-items: center; font-size: .88rem; font-weight: 700; }
.dist .bar { height: 14px; background: var(--line); border-radius: 7px; overflow: hidden; }
.dist .bar i { display: block; height: 100%; background: var(--pop); border-radius: 7px; transition: width .4s ease; }
.dist .n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.big { font-family: var(--f-display); font-size: 4rem; font-weight: 800; line-height: 1; color: var(--pop); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 20px; align-items: start; }

/* Facilitator dock */
.fac { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 25; width: min(1100px, calc(100% - 24px)); background: var(--band); color: var(--band-ink); border-radius: 22px; box-shadow: 0 20px 40px -14px rgba(10,12,40,.6); }
.fac .in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 14px; }
.fac .lab { font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; color: var(--pop); }
.fac .btn { background: transparent; color: var(--band-ink); border-color: color-mix(in srgb, var(--band-ink) 25%, transparent); }
.fac .btn:hover:not(:disabled) { border-color: var(--band-ink); }
.fac .btn.primary { background: var(--pop); color: var(--pop-ink); border-color: var(--pop); box-shadow: 0 4px 0 color-mix(in srgb, var(--pop) 50%, #000); }
.fac .sep { width: 1px; height: 24px; background: color-mix(in srgb, var(--band-ink) 20%, transparent); }
.fac .grow { flex: 1; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(100px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--wall); border-radius: 999px; padding: 10px 18px; font-size: .9rem; font-weight: 600; max-width: calc(100% - 32px); box-shadow: var(--shadow-lift); }
.loading { padding: 80px 0; text-align: center; color: var(--muted); font-weight: 600; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; width: 100%; height: 100%; }
/* Illustrations: hand-drawn line art filled with the sticky-note palette */
.ill { display: block; width: 100%; height: auto; overflow: visible; }
.ill * { fill: none; }
.ill .k { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.ill .t { stroke-width: 2; stroke-opacity: .75; }
.ill .ka { stroke: var(--accent); }
.ill .kg { stroke: var(--good); }
.ill .f1 { fill: var(--n1); } .ill .f2 { fill: var(--n2); } .ill .f3 { fill: var(--n3); } .ill .f4 { fill: var(--n4); } .ill .f5 { fill: var(--n5); }
.ill .fp { fill: var(--pop); } .ill .fw { fill: var(--surface); } .ill .fk { fill: var(--ink); }
.method .mhead { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.method .mhead > div { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.method .mhead .ill { width: 78px; flex: none; margin-top: -4px; transition: transform .2s cubic-bezier(.2, 1.6, .4, 1); }
.method:hover .mhead .ill { transform: rotate(-6deg) scale(1.08); }
.phase-head .pill { width: 120px; flex: none; margin-left: auto; }
@media (max-width: 600px) { .phase-head .pill { width: 84px; } }

/* AI */
.spark { width: 15px; height: 15px; fill: var(--pop); flex: none; }
.btn.ai { border-color: transparent; background: linear-gradient(var(--surface), var(--surface)) padding-box, linear-gradient(120deg, var(--pop), var(--accent)) border-box; color: var(--ink); }
.aipanel { border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); border: 2px solid transparent; background: linear-gradient(var(--surface), var(--surface)) padding-box, linear-gradient(120deg, var(--pop), var(--accent)) border-box; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.aihead { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; }
.aihead h3 { font-size: 1.08rem; font-weight: 800; flex: 1 1 180px; display: flex; align-items: center; gap: 8px; }
.aihead p { flex-basis: 100%; margin: 0; color: var(--muted); font-size: .88rem; }
.thinking { color: var(--muted); font-weight: 600; display: flex; gap: 6px; align-items: center; font-size: .92rem; }
.thinking i { width: 8px; height: 8px; border-radius: 50%; background: var(--pop); animation: blink 1.2s infinite; }
.thinking i:nth-child(2) { animation-delay: .2s; background: var(--accent); }
.thinking i:nth-child(3) { animation-delay: .4s; background: var(--n3); }
@keyframes blink { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
.aierr { color: var(--bad); font-size: .9rem; font-weight: 600; }
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 10px; }
.group { border: 2px dashed var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.group h4 { margin: 0; font-family: var(--f-display); font-size: 1rem; font-weight: 800; }
.group ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
.group li { font-family: var(--f-note); font-size: 1.15rem; line-height: 1.1; padding: 3px 9px; border-radius: 2px 2px 8px 2px; background: var(--note); color: var(--note-ink); overflow-wrap: anywhere; }
.group .row { display: flex; gap: 6px; }
.theme { align-self: flex-start; font-family: var(--f-body); font-size: .68rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; background: var(--note-ink); color: var(--note); padding: 1px 9px; border-radius: 999px; }
.sugg { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.sugg li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--accent-soft); flex-wrap: wrap; }
.sugg li span { flex: 1 1 200px; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.report { font-size: .95rem; overflow-wrap: anywhere; }
.report h3 { font-size: 1.35rem; font-weight: 800; margin: 2px 0 6px; }
.report h4 { font-family: var(--f-display); font-size: 1.02rem; font-weight: 800; margin: 14px 0 4px; color: var(--accent); }
.report ul { margin: 4px 0; padding-left: 20px; }
.report li { margin: 2px 0; }
.report p { margin: 4px 0; }
.report.live::after { content: "▍"; color: var(--pop); animation: blink 1s infinite; }

/* Themed boards: each format is a scene, columns sit where the metaphor puts them */
.board.scene { position: relative; isolation: isolate; overflow: hidden; }
.scene .col .notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 14px; align-items: start; }
.deco { position: absolute; z-index: -1; pointer-events: none; overflow: visible; }
.deco .cloud { fill: color-mix(in srgb, var(--surface) 88%, transparent); }
.deco .bird { fill: none; stroke: color-mix(in srgb, var(--ink) 55%, transparent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.deco .wave { fill: none; stroke: color-mix(in srgb, var(--surface) 75%, transparent); stroke-width: 3; stroke-linecap: round; }
.deco .star { fill: color-mix(in srgb, var(--ink) 55%, transparent); }
.deco .dot { fill: color-mix(in srgb, var(--pop) 35%, transparent); }
.deco .flower { fill: var(--n2); stroke: color-mix(in srgb, var(--ink) 50%, transparent); stroke-width: 1.5; }
.deco.road { left: 0; right: 0; height: 0; border-top: 5px dashed color-mix(in srgb, var(--surface) 80%, transparent); }
.board.scene { display: grid; gap: 14px; padding: 18px; border-radius: 24px; align-items: stretch; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 6%, transparent); }
.scene .col { background: color-mix(in srgb, var(--surface) 80%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.hero-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 10px; min-width: 0; text-align: center; }
.hero-cell .ill { width: 100%; max-width: 240px; filter: drop-shadow(0 14px 18px rgba(20, 24, 70, .18)); }
.hero-cell .hname { font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; letter-spacing: -.01em; }
.hero-cell .hsub { font-size: .82rem; color: var(--muted); max-width: 28ch; }
.bg-sky { background: linear-gradient(180deg, var(--sky), color-mix(in srgb, var(--sky) 35%, var(--wall))); }
.bg-sea { background: linear-gradient(180deg, var(--sky) 0 48%, var(--sea) 48% 100%); }
.bg-beach { background: linear-gradient(180deg, var(--sea) 0 34%, var(--sand) 34% 100%); }
.bg-road { background: linear-gradient(180deg, var(--sky) 0 62%, var(--road) 62% 100%); }
.bg-meadow { background: linear-gradient(180deg, var(--sky) 0 38%, var(--grass) 38% 100%); }
.bg-night { background: radial-gradient(circle at 50% 28%, var(--night1), var(--night2) 75%); }
.bg-warm { background: linear-gradient(135deg, var(--warm1), var(--warm2)); }
.bg-grid { background-color: color-mix(in srgb, var(--surface) 70%, var(--wall)); background-image: linear-gradient(var(--gridline) 1px, transparent 1px), linear-gradient(90deg, var(--gridline) 1px, transparent 1px); background-size: 26px 26px; }
.cicon { width: 40px; height: 40px; flex: none; display: grid; place-items: center; }
.cicon .ill { width: 40px; }
.cicon .ill .k { stroke-width: 2.6; }
@media (max-width: 760px) {
  .board.scene { display: flex; flex-direction: column; padding: 12px; }
  .board.scene .hero-cell { order: -1; }
  .board.scene .hero-cell .ill { max-width: 170px; }
}

/* Whiteboard canvas: the drawing fills the board, sticky notes sit on it */
.composer { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); }
.zchips { display: flex; flex-wrap: wrap; gap: 6px; }
.zchip { display: inline-flex; align-items: center; gap: 6px; border: 2px solid transparent; background: color-mix(in srgb, var(--note) 30%, var(--surface)); color: var(--ink); border-radius: 999px; padding: 3px 12px 3px 4px; font-weight: 700; font-size: .85rem; }
.zchip .ill { width: 26px; }
.zchip .ill .k { stroke-width: 2.6; }
.zchip.on { border-color: var(--ink); background: var(--note); color: var(--note-ink); }
.crow { display: flex; gap: 8px; align-items: flex-end; }
.crow textarea { flex: 1; min-width: 0; min-height: 52px; resize: vertical; font-family: var(--f-note); font-size: 1.3rem; line-height: 1.15; }
.chint { font-size: .78rem; color: var(--muted); }
.canvas-wrap { overflow-x: auto; overflow-y: hidden; border-radius: 26px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 7%, transparent), var(--shadow); -webkit-overflow-scrolling: touch; }
.canvas { position: relative; isolation: isolate; overflow: hidden; }
.zone { position: absolute; border-radius: 34px; z-index: 1; transition: background .15s ease, outline-color .15s ease; outline: 3px dashed transparent; outline-offset: 2px; }
.zone[data-act] { cursor: copy; }
.zone[data-act]:hover { background: color-mix(in srgb, var(--surface) 18%, transparent); }
.zone.on { outline-color: color-mix(in srgb, var(--accent) 75%, transparent); background: color-mix(in srgb, var(--surface) 22%, transparent); }
.zlabel { position: absolute; left: 12px; top: 10px; right: 10px; display: flex; gap: 8px; align-items: center; pointer-events: none; }
.zlabel > div { min-width: 0; }
.zlabel h3 { font-size: 1.05rem; font-weight: 800; }
.zlabel p { margin: 0; font-size: .76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zlabel .count { margin-left: auto; }
.zadd { pointer-events: auto; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--note); color: var(--note-ink); font-weight: 800; font-size: 1.2rem; line-height: 1; display: grid; place-items: center; box-shadow: var(--shadow); flex: none; }
.zadd:hover { transform: scale(1.1); }
.zhero { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4px; pointer-events: none; z-index: 0; }
.zhero .ill { width: auto; height: auto; max-width: 100%; max-height: 72%; flex: 1 1 auto; min-height: 0; filter: drop-shadow(0 18px 22px rgba(20, 24, 70, .2)); }
.zhero .hname { font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; letter-spacing: -.01em; }
.zhero .hsub { font-size: .82rem; color: var(--muted); max-width: 30ch; }
.cnote { position: absolute; width: 124px; padding: 11px 9px 6px; z-index: 2; touch-action: none; cursor: grab; transform: rotate(var(--tilt)); }
.cnote:hover { box-shadow: var(--shadow-lift); z-index: 6; }
.cnote .txt { font-size: 1.06rem; line-height: 1.08; }
.cnote::before { width: 46px; margin-left: -23px; height: 15px; top: -7px; }
.cnote.static { cursor: default; touch-action: auto; }
.cnote.dragging { cursor: grabbing; z-index: 30; box-shadow: var(--shadow-lift); transform: rotate(0deg) scale(1.06); transition: none; }
.cnote.droptarget { box-shadow: 0 0 0 4px var(--accent), var(--shadow-lift); }
.cnote.editing { width: 230px; z-index: 25; }
.cnote footer .nbtn { padding: 1px 7px; font-size: .7rem; }
.cnote .child p { font-size: 1rem; }
.cnote .vbtn { width: 24px; height: 24px; font-size: .95rem; }
.cnote.hidden { min-height: 58px; }
.cnote.inew { width: 190px; z-index: 40; cursor: auto; touch-action: auto; box-shadow: 0 0 0 3px var(--accent), var(--shadow-lift); }
.cnote.inew textarea { min-height: 70px; font-size: 1.15rem; }
main.enter .canvas .cnote { animation: noteIn .6s cubic-bezier(.2, 1.4, .4, 1) backwards; animation-delay: calc(var(--base) + 450ms + var(--s, 0) * 45ms); }
main.enter .canvas .zpill { animation: rise .6s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--base) + 150ms + var(--s, 0) * 70ms); }
@media (prefers-reduced-motion: reduce) { main.enter .canvas .cnote, main.enter .canvas .zpill { animation: none; } }
.sceneart { position: absolute; left: 0; top: 0; z-index: 0; overflow: visible; pointer-events: none; }
.sceneart.preview { position: static; width: 100%; height: auto; }
.ready-scene:has(.preview) { padding: 0; }
.sceneart .zs { fill: color-mix(in srgb, var(--zc) 58%, var(--surface)); stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; }
.sceneart .zs2 { fill: var(--zc); stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; }
.sceneart .zs.ghost { fill-opacity: .55; stroke-dasharray: 16 12; stroke-opacity: .5; }
.sceneart .zline { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-opacity: .28; }
.sceneart .zdoor { fill: color-mix(in srgb, var(--zc) 55%, var(--ink)); stroke: var(--ink); stroke-width: 3; opacity: .55; }
.sceneart .zo { fill: var(--ink); stroke: var(--ink); stroke-width: 9; }
.sceneart .zf { fill: color-mix(in srgb, var(--zc) 58%, var(--surface)); }
.sceneart .zbolt { fill: none; stroke: var(--warn); stroke-width: 8; stroke-linejoin: round; stroke-linecap: round; }
.sceneart .zrain { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; opacity: .6; }
.sceneart .zray { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; opacity: .55; }
.sceneart .zrope, .sceneart .zchain { fill: none; stroke: var(--ink); stroke-width: 3; stroke-dasharray: 3 9; stroke-linecap: round; opacity: .7; }
.sceneart .zchain { stroke-width: 5; stroke-dasharray: 8 8; }
.sceneart .ztrunk { fill: none; stroke: color-mix(in srgb, var(--n1) 40%, var(--ink)); stroke-width: 14; stroke-linecap: round; }
.sceneart .zleaf, .sceneart .zstem { fill: none; stroke: var(--good); stroke-width: 10; stroke-linecap: round; }
.sceneart .zwin { fill: color-mix(in srgb, var(--surface) 80%, var(--sky)); stroke: var(--ink); stroke-width: 3; }
.sceneart .zwheel { fill: var(--ink); }
.sceneart .zhub { fill: var(--surface); }
.sceneart .zcliff { fill: color-mix(in srgb, var(--grass) 75%, var(--ink) 25%); stroke: var(--ink); stroke-width: 3; }
.sceneart .zchasm { fill: color-mix(in srgb, var(--zc) 30%, var(--band)); stroke: var(--ink); stroke-width: 3; }
.sceneart .zarch { fill: none; stroke: var(--ink); stroke-width: 8; stroke-linecap: round; opacity: .55; }
.sceneart .zcable { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; opacity: .45; }
.sceneart .ztrack { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round; opacity: .2; }
.sceneart .zknob { fill: var(--zc); stroke: var(--ink); stroke-width: 3; opacity: .55; }
.sceneart .zbolt-dot { fill: var(--ink); opacity: .35; }
.sceneart .zhousing { fill: color-mix(in srgb, var(--band) 88%, transparent); stroke: var(--ink); stroke-width: 4; }
.sceneart .zpole { fill: none; stroke: var(--band); stroke-width: 60; }
.sceneart .zstar { fill: color-mix(in srgb, var(--pop) 30%, transparent); stroke: var(--pop); stroke-width: 5; stroke-linejoin: round; opacity: .7; }
.sceneart .zwind { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; opacity: .35; }
.sceneart .zmast { fill: none; stroke: var(--ink); stroke-width: 8; stroke-linecap: round; }
.sceneart .zchart { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linejoin: round; stroke-linecap: round; opacity: .45; }
.sceneart .zroadline { fill: none; stroke: var(--surface); stroke-width: 8; stroke-dasharray: 60 40; opacity: .8; }
.sceneart .zradar { fill: none; stroke: var(--accent); stroke-width: 3; opacity: .3; }
.sceneart .zsweep { fill: color-mix(in srgb, var(--n3) 40%, transparent); stroke: none; }
.sceneart .wm { opacity: .18; }
.zpill { position: absolute; transform: translate(-50%, -50%); z-index: 3; display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 999px; background: color-mix(in srgb, var(--surface) 93%, transparent); box-shadow: var(--shadow); white-space: nowrap; max-width: 360px; }
.zpill .cicon, .zpill .cicon .ill { width: 30px; height: 30px; }
.zpill .zt { display: flex; flex-direction: column; line-height: 1.12; min-width: 0; }
.zpill .zt b { font-family: var(--f-display); font-size: .98rem; font-weight: 800; }
.zpill .zt small { font-size: .7rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.zpill .zadd { width: 28px; height: 28px; font-size: 1.05rem; }

/* Focus mode while people write: quieter chrome, more room for the board */
body.focusmode .top .steps, body.focusmode .brand small, body.focusmode .backlink, body.focusmode .tbar { display: none; }
body.focusmode .top .wrap { padding-block: 8px; }
body.focusmode .logo { transform: scale(.8); }
body.focusmode .brand h1 { font-size: 1.05rem; }
body.focusmode main.wrap { gap: 14px; padding-top: 16px; }
body.focusmode .phase-head .bignum, body.focusmode .phase-head .pill, body.focusmode .phase-head p, body.focusmode .phase-head .eyebrow { display: none; }
body.focusmode .phase-head h2 { font-size: 1.35rem; }
body.focusmode .sig, body.focusmode .chint { display: none; }
body.focusmode .statusbar { box-shadow: none; background: color-mix(in srgb, var(--surface) 70%, transparent); padding-block: 5px; }

/* Presentation mode: a projection view for the facilitator */

.pres-prog { display: flex; gap: 6px; }

.pres-meter b { font-family: var(--f-display); font-size: clamp(2.4rem, 4vw, 3.4rem); font-weight: 800; color: var(--ink); letter-spacing: -.02em; margin-right: 8px; }

.pres-discuss { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 26px; align-items: start; }
@media (max-width: 900px) { .pres-discuss { grid-template-columns: 1fr; } }
.pres-discuss .note { padding: 34px 32px 22px; transform: rotate(-.6deg); }
.pres-discuss .note .txt { font-size: clamp(2.2rem, 4.2vw, 3.6rem); }
.pres-discuss .note .child p { font-size: 1.6rem; }
.pres-discuss .rank li { font-size: 1.1rem; padding: 12px 14px; }
.pres-big-list .alist li { padding: 16px 18px; }
.pres-big-list .alist .at { font-size: 1.35rem; }
.pres-big-list .alist .meta { font-size: .95rem; }
.pres .big { font-size: clamp(5rem, 10vw, 8rem); }
.pres .cnote { cursor: default; }
.pres-bar { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 25; background: var(--band); color: var(--band-ink); border-radius: 999px; padding: 8px 10px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; opacity: .3; transition: opacity .2s ease; box-shadow: 0 20px 40px -14px rgba(10, 12, 40, .6); max-width: calc(100% - 24px); }
.pres-bar:hover, .pres-bar:focus-within { opacity: 1; }
.pres-bar .btn { background: transparent; color: var(--band-ink); border-color: color-mix(in srgb, var(--band-ink) 25%, transparent); }
.pres-bar .btn:hover:not(:disabled) { border-color: var(--band-ink); }
.pres-bar .btn.primary { background: var(--pop); color: var(--pop-ink); border-color: var(--pop); box-shadow: none; }
.pres-bar .pos { font-family: var(--f-mono); font-size: .85rem; opacity: .8; padding: 0 4px; }

/* ---- Organised layout: home, wizard, header, guide, menus, help ---- */
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 0; display: grid; place-items: center; color: var(--band-ink); background: color-mix(in srgb, var(--band-ink) 12%, transparent); flex: none; font-weight: 800; font-size: 1rem; }
.iconbtn:hover { background: color-mix(in srgb, var(--band-ink) 24%, transparent); }

.hdr-tools { display: flex; align-items: center; gap: 8px; }
body.focusmode .hback, body.focusmode .hhelp { display: none; }
.home-hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px; align-items: center; padding-block: 8px 4px; }
@media (max-width: 760px) { .home-hero { grid-template-columns: 1fr; } .home-hero .stack { display: none; } }

.cta-row { display: flex; flex-wrap: wrap; gap: 10px; }
.empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 30px 16px; border: 2px dashed var(--line); border-radius: var(--r); }

.wiz { display: flex; flex-direction: column; gap: 20px; max-width: 1100px; width: 100%; margin: 0 auto; }
.wsteps { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.wsteps span b { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--line); color: var(--ink); font-size: .85rem; }

.wq { font-size: clamp(1.6rem, 3.6vw, 2.4rem); font-weight: 800; letter-spacing: -.02em; }
.wsub { color: var(--muted); margin: 4px 0 0; }
.wnav { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 6px; position: sticky; bottom: env(safe-area-inset-bottom, 0px); padding-block: 12px; background: linear-gradient(transparent, var(--wall) 30%); z-index: 5; }
.sprint-big { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: clamp(2rem, 6vw, 3.2rem); }
.sprint-big input { font: inherit; width: 4.5em; border: 0; border-bottom: 4px solid var(--pop); background: transparent; color: var(--ink); padding: 0 4px; }
.sprint-big input:focus { outline: none; border-color: var(--accent); }
.wfields { display: flex; flex-wrap: wrap; gap: 14px; }
.wfields > div { flex: 1 1 240px; min-width: 0; }
.best-match { display: inline-block; white-space: nowrap; font-family: var(--f-body); font-size: .68rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; background: var(--good); color: #fff; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
.ready { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 0; border-radius: 24px; overflow: hidden; box-shadow: var(--shadow); background: var(--surface); }
@media (max-width: 760px) { .ready { grid-template-columns: 1fr; } }
.ready-scene { display: grid; place-items: center; padding: 30px; min-height: 240px; position: relative; isolation: isolate; overflow: hidden; }

.ready-body { padding: 24px 26px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }

.ready-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.ready-meta span { font-size: .8rem; font-weight: 700; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 3px 10px; }
.plan { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.plan li { display: flex; gap: 10px; align-items: baseline; font-size: .9rem; }
.plan li b { width: 22px; height: 22px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: .75rem; }

.plan li span { color: var(--muted); }
.guide { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; background: var(--surface); border-radius: var(--r); padding: 14px 16px 14px 20px; box-shadow: var(--shadow); border-left: 6px solid var(--pop); }
.gtext { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.gtext b { font-family: var(--f-display); font-size: 1.15rem; font-weight: 800; letter-spacing: -.01em; }
.gtext span { color: var(--muted); font-size: .9rem; }
.gmeter { display: flex; align-items: center; gap: 10px; font-size: .88rem; font-weight: 700; white-space: nowrap; }
.gmeter .track { width: 120px; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.gmeter .track i { display: block; height: 100%; background: var(--good); border-radius: 5px; transition: width .3s ease; }
body.focusmode .guide { box-shadow: none; padding-block: 8px; }
.menuwrap { position: relative; }
.pop-menu { position: absolute; bottom: calc(100% + 10px); left: 0; min-width: 210px; background: var(--surface); color: var(--ink); border-radius: 14px; box-shadow: var(--shadow-lift); padding: 6px; display: flex; flex-direction: column; gap: 2px; z-index: 40; }
.pop-menu.right { left: auto; right: 0; }
.pop-menu button { text-align: left; border: 0; background: transparent; border-radius: 10px; padding: 9px 12px; font-weight: 600; font-size: .9rem; color: var(--ink); display: flex; gap: 8px; align-items: center; }
.pop-menu button:hover { background: var(--accent-soft); }

.pop-menu .mrow button { flex: 1; justify-content: center; background: var(--accent-soft); color: var(--accent); padding: 8px 6px; }
.fac .stepn { font-family: var(--f-mono); font-size: .8rem; opacity: .75; }
@media (max-width: 600px) { .fac:not(.mini) .lab, .fac:not(.mini) .sep, .fac:not(.mini) > .in > [data-act="present"] { display: none; } .fac .in { gap: 6px; } }
.modal { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--band) 75%, transparent); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); animation: fadeIn .25s ease both; }
.mcard { position: relative; width: min(860px, 100%); max-height: calc(100% - 20px); overflow: auto; background: var(--surface); color: var(--ink); border-radius: 22px; padding: 26px; box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .5); display: flex; flex-direction: column; gap: 14px; animation: cardIn .45s cubic-bezier(.2, 1.2, .4, 1) both; }
.mcard h2 { font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em; }
.mcard .close { position: absolute; top: 14px; right: 14px; color: var(--ink); background: var(--accent-soft); }
.hsteps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 10px; }
.hsteps li { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; background: color-mix(in srgb, var(--accent-soft) 60%, transparent); }
.hsteps .ill { width: 58px; flex: none; }
.hsteps b { display: block; font-family: var(--f-display); }
.hsteps span { font-size: .85rem; color: var(--muted); }
.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 10px; }
.roles > div { border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.roles h3 { font-size: 1rem; font-weight: 800; margin-bottom: 4px; }
.roles ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: .88rem; }
kbd { font-family: var(--f-mono); font-size: .78rem; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 1px 6px; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes cardIn { from { opacity: 0; transform: translateY(24px) scale(.97); } }
@media (prefers-reduced-motion: reduce) { .modal, .mcard { animation: none; } }

/* Vote & discussion on the board */
.cnote.votable { cursor: pointer; }
.cnote.votable:hover { box-shadow: 0 0 0 3px var(--pop), var(--shadow-lift); }
.cnote .votes .dots i { width: 13px; height: 13px; }
.cnote.target { cursor: pointer; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 60%, transparent), var(--shadow); }
.cnote.sel { box-shadow: 0 0 0 4px var(--accent), var(--shadow-lift); z-index: 8; }
.cnote.dim { opacity: .5; }
.cnote.discussed { opacity: .38; }
.cnote.pickable { cursor: pointer; }
.cnote.pickable:hover { opacity: 1; box-shadow: 0 0 0 3px var(--accent), var(--shadow-lift); }
.cnote.focusnote { z-index: 20; transform: rotate(0deg) scale(1.22); box-shadow: 0 0 0 5px var(--pop), var(--shadow-lift); }
.cnote .rankb { font-family: var(--f-display); font-weight: 800; font-size: .9rem; color: var(--note-ink); }
.cnote .vtotal { font-size: .72rem; padding: 1px 7px; }
.donemark { position: absolute; top: -10px; right: -8px; width: 24px; height: 24px; border-radius: 50%; background: var(--good); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: .8rem; box-shadow: var(--shadow); }
.discuss2 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: stretch; }
@media (max-width: 860px) { .discuss2 { grid-template-columns: 1fr; } }
.nowcard { background: var(--note, var(--surface)); color: var(--note-ink); border-radius: 4px 4px 22px 4px; padding: 18px 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.nowcard.empty-now { background: var(--surface); color: var(--ink); border: 2px dashed var(--line); box-shadow: none; }
.nowcard.empty-now p { margin: 0; color: var(--muted); }
.nowcard .txt { font-family: var(--f-note); font-size: clamp(1.6rem, 2.6vw, 2.3rem); line-height: 1.1; margin: 0; overflow-wrap: anywhere; }
.nowcard .child p { font-size: 1.2rem; }
.nowtop { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.nowtop .eyebrow { color: var(--note-ink); opacity: .75; }
.nowcard.empty-now .eyebrow { color: var(--pop); opacity: 1; }
.nowacts { display: flex; gap: 8px; margin-top: auto; }
.nowcard:not(.empty-now) .btn { background: var(--note-ink); color: var(--note); border-color: var(--note-ink); box-shadow: none; }

/* Signature */
.sig { text-align: center; padding: 6px 0 0; font-size: .8rem; color: var(--muted); letter-spacing: .02em; }

.sig b i { font-style: normal; color: var(--pop); }
.i-by { font-size: .78rem; opacity: .65; animation: fadeUp .7s 1.1s ease both; }
.i-by b { font-family: var(--f-display); font-weight: 800; opacity: 1; }

/* Format focus filter */
.frow { display: flex; flex-wrap: wrap; gap: 8px; }
.fchip { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: .88rem; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; transition: transform .12s ease, border-color .12s ease; }

.mfoot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; justify-content: space-between; }

/* Retro library */

.rcard { background: var(--surface); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; min-width: 0; transition: transform .15s ease, box-shadow .15s ease; border: 2px solid transparent; }
.rcard:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
.rcard.live { border-color: var(--good); }
.rcard .rrow { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.rcard .rrow .ill { width: 70px; flex: none; }
.rnum { font-family: var(--f-display); font-weight: 800; font-size: 2.7rem; line-height: .95; letter-spacing: -.03em; overflow-wrap: anywhere; min-width: 0; }
.rnum small { display: block; font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; color: var(--pop); font-weight: 800; margin-bottom: 4px; }
.rcard h3 { font-size: 1.02rem; font-weight: 700; overflow-wrap: anywhere; }
.rmeta { color: var(--muted); font-size: .84rem; }
.rstats { display: flex; gap: 6px; flex-wrap: wrap; }

.pill-live { display: inline-flex; gap: 7px; align-items: center; font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--good); }

@keyframes livePulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
.pill-done { font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.newretro { display: flex; flex-direction: column; gap: 16px; }
.setup-row > .sprint { flex: 0 1 170px; }
.sprint-field { position: relative; }
.sprint-field span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-weight: 700; color: var(--muted); pointer-events: none; }
.sprint-field input { padding-left: 62px; font-weight: 800; font-family: var(--f-display); font-size: 1.1rem; }
.backlink { border: 0; border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: .8rem; color: var(--band-ink); background: color-mix(in srgb, var(--band-ink) 12%, transparent); white-space: nowrap; }
.fsbtn { border: 0; border-radius: 999px; padding: 5px 12px 5px 9px; font-weight: 700; font-size: .8rem; color: var(--band-ink); background: color-mix(in srgb, var(--band-ink) 12%, transparent); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.fsbtn:hover { background: color-mix(in srgb, var(--band-ink) 22%, transparent); }
.fsbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 600px) { .fsbtn span { display: none; } .fsbtn { padding: 6px; } }
.backlink:hover { background: color-mix(in srgb, var(--band-ink) 22%, transparent); }
.followup .alist li { box-shadow: none; border: 2px solid var(--line); }
.banner .btn { margin-left: 8px; }

/* Motion: intro splash, step curtain, staggered entrances, self-drawing illustrations */
.intro { position: fixed; inset: 0; z-index: 70; background: var(--band); color: var(--band-ink); display: grid; place-items: center; clip-path: inset(0 0 0 0); cursor: pointer; }
.intro.out { clip-path: inset(0 0 100% 0); transition: clip-path .75s cubic-bezier(.76, 0, .24, 1); }
.i-in { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 0 16px; }
.i-logo { position: relative; width: 124px; height: 120px; }

let toastT;
function toast(msg) {
  const t = document.getElementById("toast");

  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200);

async function write(fn) {
  try { await fn(); return true; }
  catch (e) {
    const code = e && e.code;
    if (code === "invalid_argument") { S.readOnly = true; toast("You have view-only access. Ask the facilitator to make you a Contributor."); }
    else if (code === "quota_exceeded") toast("The retro board is full. Delete some notes to add more.");
    else if (code === "resource_exhausted") toast("Too many changes at once. Try again in a moment.");
    else toast("Couldn't save that. Check your connection and try again.");
    schedule(); return false;
  }
}

  if (isDone() && S.viewPhase != null) return S.viewPhase;
  return typeof s.phase === "number" ? Math.max(0, s.phase) : 0;
};
const retroName = r => { const t = r.title || "Retro", l = sprintLabel(r); return t.toLowerCase().includes(l.toLowerCase()) ? t : `${l} · ${t}`; };
const sprintLabel = r => r && r.sprint ? `Sprint ${r.sprint}` : "Retro";
const prevRetro = () => {
  const cur = sess(); if (!cur) return null;
  return S.retros.filter(r => r.id !== S.bid && (r.createdAt || 0) < (cur.createdAt || 0)).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))[0] || null;
};
const nextSprint = () => {
  const nums = S.retros.map(r => parseInt(String(r.sprint || "").replace(/\D+/g, ""), 10)).filter(n => !isNaN(n));
  return nums.length ? String(Math.max(...nums) + 1) : "";
};
const liveRetros = () => S.retros.filter(r => r.status !== "done" && (r.updatedAt || r.createdAt || 0) > Date.now() - 12 * 3600e3).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
const isFac = () => !!(sess() && S.me && sess().facilitator === S.me && !isDone());
const canWrite = () => !!(S.db && S.me && !S.readOnly);
const path = p => `boards/${S.bid}/${p}`;
const colIndex = key => Math.max(0, method().cols.findIndex(c => c[0] === key));
const noteVar = key => { const L = typeof LAYOUTS !== "undefined" && sess() && LAYOUTS[sess().method]; const z = L && L.zones.find(z => z.k === key); return z ? `var(--n${z.c || 1})` : `var(--n${colIndex(key) % 5 + 1})`; };
const name = id => (S.profiles[id] && S.profiles[id].name) || "";

function myVotes() { return S.pendingVotes || (S.votes[S.me] && S.votes[S.me].cards) || {}; }
function votesUsed() { return Object.values(myVotes()).reduce((a, b) => a + (b || 0), 0); }
function totalVotes(cid) {
  let t = 0;
  for (const [uid, v] of Object.entries(S.votes)) { if (uid === S.me) continue; t += (v.cards && v.cards[cid]) || 0; }
  return t + (myVotes()[cid] || 0);
}
function topCards() {
  const ids = new Set(S.cards.map(c => c.id));
  return S.cards.filter(c => !c.parent || !ids.has(c.parent));
}
function childrenOf(id) { return S.cards.filter(c => c.parent === id).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)); }
function hereCount(bid) { return new Set(S.peers.filter(p => p.kind === "viewer" && p.presence && p.presence.bid === bid).map(p => p.by || p.peer)).size; }
function participants() {
  const seen = new Map();
  for (const p of S.peers) {
    if (p.kind !== "viewer") continue;
    if (S.bid && (!p.presence || p.presence.bid !== S.bid) && !p.sameTab) continue;
    const id = p.by || (p.presence && typeof p.presence.uid === "string" ? p.presence.uid : null) || ("peer:" + p.peer);
    if (!seen.has(id)) seen.set(id, p);
  }
  return [...seen.entries()].map(([id, p]) => ({ id, peer: p }));
}

/* ---------- render ---------- */
let raf = 0;
let holdT = 0;
function schedule() {
  const wait = S.holdUntil - Date.now();
  if (wait > 0) { if (!holdT) holdT = setTimeout(() => { holdT = 0; schedule(); }, wait + 20); return; }
  if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
}

function prepEnter(root) {
  [...root.children].forEach((el, i) => el.style.setProperty("--d", i));
  root.querySelectorAll(".retros,.methods,.weather,.roti,.rank,.alist,.board,.notes,.groups,.sugg,.zchips").forEach(c => {
    if (!c.classList.contains("notes")) c.classList.add("stg");
    [...c.children].forEach((el, i) => el.style.setProperty("--s", Math.min(i, 10)));
  });
  prepIll(root);
}
function prepIll(root) { root.querySelectorAll(".ill *").forEach(el => { if (el.tagName !== "g") el.setAttribute("pathLength", "1"); }); }

let tTok = 0;
function transition(ph, custom) {
  if (reduceMotion()) { S.enterReq = true; S.enterBase = 0; schedule(); return; }
  const tok = ++tTok, cur = document.getElementById("curtain"), p = custom ? null : PHASES[ph];
  const notes = [["--n1", "7%", "16%", "-12deg"], ["--n2", "84%", "12%", "9deg"], ["--n3", "12%", "74%", "6deg"], ["--n4", "80%", "70%", "-8deg"], ["--n5", "46%", "88%", "14deg"]];
  cur.innerHTML = `${p ? `<div class="c-num">${ph + 1}</div>` : custom && custom.num ? `<div class="c-num">${esc(custom.num)}</div>` : ""}${notes.map(([c, l, t, r], i) => `<span class="c-note" style="--c:var(${c});left:${l};top:${t};--r:${r};transition-delay:${i * 50}ms"></span>`).join("")}
    <div class="c-in"><div class="c-ill">${p ? ILL[p.key] : (custom && custom.ill) || ILL.reveal}</div>
      <div class="c-eyebrow">${p ? `Step ${ph + 1} of ${PHASES.length}` : esc((custom && custom.eyebrow) || "Retro Live")}</div>
      <div class="c-title">${p ? esc(p.title) : esc((custom && custom.title) || "")}</div>
      ${p ? `<div class="c-prog">${PHASES.map((_, i) => `<i class="${i < ph ? "on" : i === ph ? "cur" : ""}"></i>`).join("")}</div>` : ""}</div>`;
  prepIll(cur);
  cur.hidden = false; cur.className = "curtain"; void cur.offsetWidth; cur.className = "curtain in";
  S.holdUntil = Date.now() + 5000;
  setTimeout(() => { if (tok !== tTok) return; window.scrollTo(0, 0); S.enterReq = true; S.enterBase = .55; S.holdUntil = 0; render(); }, 500);
  setTimeout(() => { if (tok !== tTok) return; cur.className = "curtain out"; }, 1150);
  setTimeout(() => { if (tok !== tTok) return; cur.hidden = true; cur.className = "curtain"; cur.innerHTML = ""; }, 1800);
}

function playIntro() {
  const el = document.getElementById("intro");
  if (reduceMotion()) { el.remove(); S.enterReq = true; S.enterBase = 0; return; }
  S.holdUntil = Date.now() + 5000; S.enterReq = true; S.enterBase = .12;
  let done = false;
  const finish = () => { if (done) return; done = true; el.classList.add("out"); S.holdUntil = 0; schedule(); setTimeout(() => el.remove(), 800); };
  el.addEventListener("click", finish);
  setTimeout(finish, 1650);
}

async function announce(list) {
  const ids = [...new Set(list.filter(p => p.kind === "viewer" && !p.isMe && p.by).map(p => p.by))];
  if (!ids.length || !S.user) return;
  try {
    const ps = await S.user.profiles(ids);
    const first = (ps[ids[0]] && ps[ids[0]].name) || "A teammate";
    toast(ids.length > 1 ? `${first} and ${ids.length - 1} more joined the retro` : `${first} joined the retro`);
  } catch (_) {}
}

function render() {
  let enter = false;
  if (S.enterReq && (S.status === "nodb" || (S.status === "ready" && S.session !== undefined))) { enter = true; S.enterReq = false; }
  S.entering = enter;
  const a = document.activeElement;
  let fid = null, ss = 0, se = 0;
  if (a && a.id && (a.tagName === "TEXTAREA" || a.tagName === "INPUT")) { fid = a.id; try { ss = a.selectionStart; se = a.selectionEnd; } catch (_) {} }
  $app.innerHTML = view();
  document.body.classList.toggle("focusmode", isFocus());
  document.body.classList.toggle("presenting", !!(S.present && S.bid && sess()));
  if (enter) { const m = $app.querySelector("main"); if (m) prepEnter(m); if (!reduceMotion()) S.holdUntil = Date.now() + S.enterBase * 1000 + 1400; }
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus({ preventScroll: true }); try { el.setSelectionRange(ss, se); } catch (_) {} } }
  if (S.cardsLoaded) S.cards.forEach(c => S.seen.add(c.id));
  const wrap = $app.querySelector(".canvas-wrap");
  if (wrap) { const w = Math.max(960, Math.floor(wrap.clientWidth)); if (Math.abs(w - (S.canvasW || 0)) > 4) { S.canvasW = w; schedule(); } }
  const ph = phase();
  if (S.lastPhase !== null && S.lastPhase >= 0 && ph !== S.lastPhase && PHASES[ph] && PHASES[ph].key === "roti") setTimeout(confetti, 900);
  S.lastPhase = ph;
  tick();
  refreshProfiles();
}

let profKey = "";
async function refreshProfiles() {
  if (!S.user) return;
  const ids = new Set(participants().map(p => p.id).filter(id => !id.startsWith("peer:")));
  if (sess() && sess().facilitator) ids.add(sess().facilitator);
  const list = [...ids].sort();
  try {
    const ps = await S.user.profiles(list);
    const sig = list.join("|") + list.map(id => (ps[id] && ps[id].name) + (ps[id] && ps[id].avatarUrl)).join("|");
    if (sig !== profKey) { profKey = sig; S.profiles = { ...S.profiles, ...ps }; schedule(); }
  } catch (_) {}
}

function view() {
  if (S.status === "loading") return `<main class="wrap"><div class="loading">Joining the retro…</div></main>`;
  if (S.status === "nodb") return `<main class="wrap${S.entering ? " enter" : ""}" style="--base:${S.enterBase || 0}s"><div class="panel"><h2>Open this retro from claude.ai</h2><p>To join live, open this link while signed in to your claude.ai account. The shared board isn't available in this view.</p></div></main>`;
  if (S.session === undefined) return `<main class="wrap"><div class="loading">Loading your retros…</div></main>`;
  const ph = phase();
  if (S.present && S.bid && sess() && ph >= 0) return presentView(ph);
  const body = !S.bid ? homeView() : !sess() ? `<div class="loading">Opening the retro…</div>` : phaseView(ph);
  return header() + `<main class="wrap${S.entering ? " enter" : ""}" style="--base:${S.enterBase || 0}s">${banners()}${body}<footer class="sig">Retro Live · made by <b>Michael<i>Soft</i></b></footer></main>` + facBar() + helpModal();

const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement || null;
const isFull = () => !!fsEl();
const fsAvailable = () => !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);

  try {
    if (isFull()) await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const el = document.documentElement; await (el.requestFullscreen || el.webkitRequestFullscreen).call(el, { navigationUI: "hide" }); }
  } catch (_) { toast("Your browser blocked full screen here. Try F11, or Ctrl+Cmd+F on a Mac."); }
}
["fullscreenchange", "webkitfullscreenchange"].forEach(ev => document.addEventListener(ev, () => schedule()));

function header() {
  const s = sess(); const ph = phase();
  const ppl = participants();
  const avs = ppl.slice(0, 6).map(p => {
    const pr = S.profiles[p.id];
    const nm = esc((pr && pr.name) || "Teammate");

  }).join("");

  return `<header class="top"><div class="wrap">

    <div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i></span><div class="brand-text"><h1>${esc(title)}</h1><small>${sub}</small></div></div>
    <div class="hdr-tools">
      ${ph >= 0 && !isDone() ? `<div id="timer" class="timer idle" role="timer" aria-live="off">--:--</div>` : ""}
      <div class="people"><span class="avs">${avs}</span><span class="n">${ppl.length} online</span></div>
      <button class="iconbtn hhelp" data-act="help" aria-label="How it works" title="How it works">?</button>
      ${fsAvailable() ? `<button class="iconbtn" data-act="fullscreen" aria-pressed="${isFull()}" aria-label="${isFull() ? "Exit full screen" : "Full screen"}" title="${isFull() ? "Exit full screen (Esc)" : "Full screen"}">${isFull()
        ? `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6"/></svg>`
        : `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/></svg>`}</button>` : ""}

function banners() {
  let h = "";

  else if (S.readOnly) h += `<div class="banner">Your access doesn't allow editing. Ask whoever shared the retro to give you the Contributor role.</div>`;
  if (S.bid && isDone()) h += `<div class="banner info">This retro is closed. Tap any step above to look back at it.${S.me && sess().facilitator === S.me ? `<button class="btn sm" data-act="reopen">Reopen</button>` : ""}</div>`;
  if (S.mergeSrc) h += `<div class="banner info">Now click the note to stack it on. <button class="link" data-act="mergecancel">Cancel</button></div>`;

}

function phaseHead(ph) {
  const p = PHASES[ph];
  let hint = p.hint;
  if (p.key === "vote") hint = `You have ${plural(sess().votesPerPerson || 3, "vote")}. Put them on the topics you most want to discuss. Stack several on one topic if it matters a lot.`;
  return `<div class="phase-head"><span class="bignum" aria-hidden="true">${ph + 1}</span><div class="txt"><div class="eyebrow">Step ${ph + 1} of ${PHASES.length} · ${p.label}</div><h2>${p.title}</h2></div>${ILL[p.key] || ""}</div>` + guide(p.key, ph);
}

/* ---------- "Your turn" guide: one clear instruction per step ---------- */
const PHASE_SHORT = [
  "Everyone picks the weather of their sprint, anonymously.",
  "Everyone writes sticky notes in private, straight on the board.",
  "All notes appear. Read them together and stack the duplicates.",
  "Each person spends a few dots on the topics that matter most.",
  "Talk through the top topics, one at a time.",
  "Turn the talk into actions, each with an owner.",
  "Rate the retro and share the summary.",
];
function guide(k, ph) {
  const on = participants().length, doneKey = `${S.bid}:${ph}`;
  const doneN = S.peers.filter(p => p.kind === "viewer" && p.presence && p.presence.done === doneKey).length;
  const meDone = S.peers.some(p => p.sameTab && p.presence && p.presence.done === doneKey);
  const meter = (n, of, label) => `<div class="gmeter"><span class="track"><i style="width:${of ? Math.min(100, Math.round(n / of * 100)) : 0}%"></i></span><span>${n} / ${of} ${label}</span></div>`;
  const doneBtn = label => canWrite() ? `<button class="btn ${meDone ? "" : "primary"}" data-act="done" data-k="${doneKey}" ${S.room ? "" : "disabled"}>${label}</button>` : "";
  if (isDone()) return `<div class="guide"><div class="gtext"><b>Looking back at this step</b><span>${PHASE_SHORT[ph]}</span></div></div>`;
  let t = "", sub = "", mid = "", right = "";
  if (k === "checkin") {
    const w = WEATHER.find(x => x[0] === (S.moods[S.me] && S.moods[S.me].w));
    t = w ? `You picked ${w[2]} ${w[1]}` : "Your turn: pick the weather of your sprint";
    sub = w ? "You can change it until the next step." : "Answers are anonymous.";
    mid = meter(Object.keys(S.moods).length, on, "answered");
  } else if (k === "write") {
    const mine = S.cards.filter(c => c.author === S.me).length;
    t = meDone ? "You're done. Waiting for the others" : "Your turn: click on the drawing to stick a note";
    sub = `Click where your note belongs, type, then Enter. ${plural(mine, "note")} from you so far; nobody can read them until the reveal.`;
    mid = meter(doneN, on, "done"); right = doneBtn(meDone ? "Keep writing" : "I'm done");
  } else if (k === "reveal") {
    t = "Read the board together";
    sub = "To group duplicates, drag a note onto another, or use ⧉ then click the note to stack it on.";
    mid = `<div class="gmeter"><span>${plural(S.cards.length, "note")} on the board</span></div>`;
  } else if (k === "vote") {
    const max = sess().votesPerPerson || 3, used = votesUsed();
    t = used >= max ? "All your votes are placed" : `Your turn: place your ${plural(max, "vote")}`;
    sub = `Click a note on the board to give it a vote (− to take it back). ${max - used} left.`;
    mid = `<span class="vleft"><span class="dots">${Array.from({ length: max }, (_, i) => `<i class="${i < used ? "on" : ""}"></i>`).join("")}</span></span>` + meter(doneN, on, "voted");
    right = doneBtn(meDone ? "Change my votes" : "I've voted");
  } else if (k === "discuss") {
    const list = ranked();
    t = isFac() ? "Click a note to discuss it, then capture actions" : "Talk it through and suggest actions";
    sub = `${list.filter(x => x.c.discussed).length} of ${list.length} topics discussed so far.`;
  } else if (k === "actions") {
    const no = S.actions.filter(a => !a.owner).length;
    t = "Agree on concrete actions";
    sub = no ? `${plural(no, "action")} still without an owner.` : S.actions.length ? "Every action has an owner." : "Add the first action below.";
  } else if (k === "roti") {
    const mine = S.roti[S.me] && S.roti[S.me].score;
    t = mine ? `You rated this retro ${mine}/5` : "Your turn: rate this retro from 1 to 5";
    sub = "1 means it was a waste of time, 5 means it was time well spent.";
    mid = meter(Object.keys(S.roti).length, on, "rated");
  }
  return `<div class="guide"><div class="gtext"><b>${t}</b><span>${sub}</span></div>${mid}${right}</div>`;
}

  if (!S.help) return "";
  return `<div class="modal" role="dialog" aria-modal="true" aria-label="How Retro Live works" data-act="helpbg"><div class="mcard">
    <button class="iconbtn close" data-act="help" aria-label="Close">✕</button>
    <div class="eyebrow">How it works</div><h2>Seven steps, one shared board</h2>
    <ol class="hsteps">${PHASES.map((p, i) => `<li>${ILL[p.key] || ""}<div><b>${i + 1}. ${p.label}</b><span>${PHASE_SHORT[i]}</span></div></li>`).join("")}</ol>
    <div class="roles">

      <div><h3>Shortcuts while presenting</h3><ul><li><kbd>←</kbd> <kbd>→</kbd> change step</li><li><kbd>T</kbd> start or stop a 5 min timer</li><li><kbd>N</kbd> next topic · <kbd>Esc</kbd> exit</li></ul></div>
