/* ---------- AI ---------- */
const aiOn = () => !!(S.sample && isFac() && canWrite());
function aiErr(e) {
  const c = e && e.code;
  if (c === "not_granted") return "AI isn't allowed for this page. You can allow it from the page's permissions.";
  if (c === "rate_limited") return "Too many AI requests right now. Try again in a minute.";
  if (c === "sampling_disabled") return "AI is turned off for your account.";
  if (c === "invalid_json") return "The AI answer came back garbled. Try again.";
  return "The AI couldn't answer. Try again.";
}
const colName = key => (method().cols.find(c => c[0] === key) || [, key])[1];

function retroDigest() {
  const s = sess(), m = method();
  const pr = prevRetro();
  const L = [`Retro: ${sprintLabel(s)} · ${s.title || "Sprint retro"}`, `Format: ${m.name} (columns: ${m.cols.map(c => c[1]).join(", ")})`, `People online: ${participants().length}`];
  const moods = Object.values(S.moods);
  if (moods.length) L.push("Weather check-in: " + WEATHER.map(([k, , nm]) => { const n = moods.filter(x => x.w === k).length; return n ? `${nm} ×${n}` : null; }).filter(Boolean).join(", "));
  L.push("", "Topics, ranked by votes:");
  ranked().forEach(x => {
    L.push(`- (${plural(x.v, "vote")}) [${colName(x.c.col)}]${x.c.theme ? " {" + x.c.theme + "}" : ""} ${x.c.text.replace(/\n/g, " ")}${x.c.discussed ? " (discussed)" : ""}`);
    childrenOf(x.c.id).forEach(ch => L.push(`    - grouped: ${ch.text.replace(/\n/g, " ")}`));
  });
  L.push("", "Actions agreed:");
  if (!S.actions.length) L.push("- none yet");
  [...S.actions].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)).forEach(a => L.push(`- ${a.text} | owner: ${a.owner || "none"} | due: ${a.due || "not set"}${a.done ? " | done" : ""}`));
  if (pr && S.prevActions.length) { L.push("", `Follow-up on ${sprintLabel(pr)} actions: ${S.prevActions.filter(a => a.done).length}/${S.prevActions.length} done`); S.prevActions.forEach(a => L.push(`- ${a.text}${a.done ? " (done)" : " (not done)"}`)); }
  const sc = Object.values(S.roti).map(r => r.score).filter(Boolean);
  if (sc.length) L.push("", `ROTI: ${(sc.reduce((a, b) => a + b, 0) / sc.length).toFixed(1)}/5 from ${plural(sc.length, "vote")}`);
  return L.join("\n").slice(0, 60000);
}

async function aiGroups() {
  const tops = topCards();
  if (tops.length < 3) { toast("Add a few more notes first."); return; }
  S.ai.groupsBusy = true; S.ai.groups = null; S.ai.err.groups = null; schedule();
  const notes = tops.map(c => ({ id: c.id, column: colName(c.col), text: [c.text, ...childrenOf(c.id).map(x => x.text)].join(" / ").slice(0, 400) }));
  const prompt = `You are helping facilitate a sprint retrospective (format: ${method().name}). Below are the team's sticky notes as JSON.

Group the notes that are about the same underlying topic: duplicates, near-duplicates, or clearly the same theme. Notes may come from different columns. Only group notes that clearly belong together and leave the rest out. Each group needs at least 2 notes and a short theme name of 2 to 4 words, written in the language of the notes.

Reply with only JSON in this shape: {"groups":[{"theme":"Flaky CI","ids":["id1","id2"]}]}

Notes:
${JSON.stringify(notes)}`;
  try {
    const r = await S.sample.json(prompt);
    const valid = new Set(tops.map(c => c.id)), used = new Set();
    const groups = (r && Array.isArray(r.groups) ? r.groups : []).map(g => ({
      theme: String((g && g.theme) || "Theme").slice(0, 40),
      ids: (g && Array.isArray(g.ids) ? g.ids : []).map(String).filter(id => valid.has(id) && !used.has(id) && used.add(id)),
    })).filter(g => g.ids.length >= 2);
    S.ai.groups = groups;
    if (!groups.length) toast("No clear duplicates found.");
  } catch (e) { S.ai.err.groups = aiErr(e); }
  finally { S.ai.groupsBusy = false; schedule(); }
}

async function applyGroup(i) {
  const g = S.ai.groups && S.ai.groups[i]; if (!g) return;
  S.ai.groups = S.ai.groups.filter((_, j) => j !== i); schedule();
  const ids = g.ids.filter(id => S.cards.some(c => c.id === id));
  const head = ids[0]; if (!head) return;
  for (const id of ids.slice(1)) {
    for (const ch of S.cards.filter(c => c.parent === id)) await write(() => S.db.doc(path("cards/" + ch.id)).update({ parent: head }));
    await write(() => S.db.doc(path("cards/" + id)).update({ parent: head }));
  }
  await write(() => S.db.doc(path("cards/" + head)).update({ theme: g.theme }));
}

Use Markdown with exactly these parts:

## TL;DR (2 sentences)

function md(src) {
  const out = []; let list = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  for (const raw of String(src || "").split("\n")) {
    const line = raw.trimEnd();
    const li = line.match(/^\s*[-*•]\s+(.*)/);
    if (li) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${inline(li[1])}</li>`); continue; }
    if (list) { out.push("</ul>"); list = false; }
    if (!line.trim()) continue;
    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) { out.push(h[1].length === 1 ? `<h3>${inline(h[2])}</h3>` : `<h4>${inline(h[2])}</h4>`); continue; }
    out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push("</ul>");
  return out.join("");
}

  const pos = {}, autos = {};
  for (const c of topCards().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0))) {
    if (typeof c.x === "number" && typeof c.y === "number") pos[c.id] = { x: c.x * L.W, y: c.y * L.W };
    else (autos[c.col] = autos[c.col] || []).push(c);
  }
  for (const [col, list] of Object.entries(autos)) {
    const R = L.rects[col] || Object.values(L.rects)[0];
    const sw = NOTE_W + 8, cols = Math.max(1, Math.floor((R.w + 8) / sw)), rows = Math.ceil(list.length / cols);
    let sh = NOTE_H + 10;
    if (rows > 1 && rows * sh > R.h) sh = Math.max(24, (R.h - NOTE_H) / (rows - 1));
    const used = Math.min(cols, list.length), offX = R.x + (R.w - (used * sw - 8)) / 2;
    list.forEach((c, i) => { const h = hashN(c.id); pos[c.id] = { x: offX + (i % cols) * sw + (h % 7) - 3, y: R.y + Math.floor(i / cols) * sh + ((h >> 3) % 5) - 2 }; });
  }
  return pos;
}
function inlineEditor(L) {
  const N = S.inlineNew; if (!N || S.present) return "";
  const col = method().cols.find(c => c[0] === N.col); if (!col) return "";
  let x, y;
  if (N.auto) { const R = L.rects[N.col]; x = R.x + R.w / 2 - 95; y = R.y + 6; } else { x = N.x * L.W; y = N.y * L.W; }
  x = Math.max(6, Math.min(L.W - 196, x)); y = Math.max(6, y);
  return `<div class="note cnote inew" style="left:${Math.round(x)}px;top:${Math.round(y)}px;--note:${noteVar(N.col)};--tilt:0deg" role="dialog" aria-label="New note for ${esc(col[1])}">
    <span class="tag">${esc(col[1])}</span><textarea id="compose" maxlength="500" data-compose="1" placeholder="Write your note…">${draft("compose")}</textarea>
    <footer><span class="tag">Enter ↵</span><span class="acts"><button class="nbtn" data-act="inlinecancel">Cancel</button><button class="nbtn strong" data-act="composeadd">Stick it</button></span></footer></div>`;
}
function composer() { return ""; }

function canvasNote(c, k, P, i) {
  const mine = c.author === S.me, tilt = ((hashN(c.id) % 7) - 3) * .6;
  const base = `left:${Math.round(P.x)}px;top:${Math.round(P.y)}px;--note:${noteVar(c.col)};--tilt:${tilt}deg;--s:${Math.min(i, 20)}`;
  if (k === "write" && (!mine || S.present)) return `<div class="note cnote hidden static" style="${base}" aria-label="Hidden note"><div class="bars"><i style="width:88%"></i><i style="width:60%"></i></div></div>`;
  const kids = childrenOf(c.id);
  const isNew = S.cardsLoaded && !S.seen.has(c.id);
  const draggable = !S.present && !S.mergeSrc && canWrite() && ((k === "write" && mine) || k === "reveal");
  const R = k === "discuss" && S.rankMap ? S.rankMap[c.id] : null;
  const fid = sess().focusCardId;
  if (S.editing === c.id) {
    const id = `edit-${c.id}`;
    return `<article class="note cnote editing static" style="${base}"><textarea id="${id}" maxlength="500" data-edit="${c.id}">${draft(id, c.text)}</textarea>
      <footer><span></span><span class="acts"><button class="nbtn" data-act="editcancel">Cancel</button><button class="nbtn strong" data-act="editsave" data-id="${c.id}">Save</button></span></footer></article>`;
  }
  let left = mine && !S.present ? `<span class="tag">You</span>` : `<span></span>`, acts = "";
  if (!S.present && (k === "write" || k === "reveal") && mine && canWrite()) acts = `<button class="nbtn" data-act="edit" data-id="${c.id}" aria-label="Edit" title="Edit">✎</button><button class="nbtn" data-act="del" data-id="${c.id}" aria-label="Delete" title="Delete">✕</button>`;
  if (!S.present && k === "reveal" && canWrite() && !S.mergeSrc) acts += `<button class="nbtn" data-act="merge" data-id="${c.id}" aria-label="Stack onto another note" title="Stack onto another note">⧉</button>`;
  if (k === "discuss" && R) { left = `<span class="rankb">#${R.rank}</span>`; acts = `<span class="vtotal" title="Votes">${R.v} ${R.v === 1 ? "vote" : "votes"}</span>`; }
  if (k === "vote" && !S.present) {
    const mv = myVotes()[c.id] || 0, rest = (sess().votesPerPerson || 3) - votesUsed();
    left = `<span class="votes"><button class="vbtn" data-act="vote" data-id="${c.id}" data-d="-1" aria-label="Remove a vote" ${mv > 0 && canWrite() ? "" : "disabled"}>−</button>
      <span class="dots" aria-label="${plural(mv, "vote")}">${Array.from({ length: mv }, () => "<i></i>").join("")}</span>
      <button class="vbtn" data-act="vote" data-id="${c.id}" data-d="1" aria-label="Add a vote" ${rest > 0 && canWrite() ? "" : "disabled"}>+</button></span>`;
  }
  const kidsH = kids.map(ch => `<div class="child"><p>${esc(ch.text)}</p>${k === "reveal" && canWrite() && !S.present ? `<button class="nbtn" data-act="unmerge" data-id="${ch.id}" aria-label="Ungroup">↩</button>` : ""}</div>`).join("");
  let extra = "", cls = "";
  if (k === "reveal" && S.mergeSrc) { if (S.mergeSrc === c.id) cls = "sel"; else { cls = "target"; extra = `data-act="mergehere"`; } }
  else if (k === "vote" && !S.present && canWrite() && votesUsed() < (sess().votesPerPerson || 3)) { cls = "votable"; extra = `data-act="vote" data-d="1" title="Click to give this note a vote"`; }
  else if (k === "discuss") { cls = (c.id === fid ? "focusnote" : fid ? "dim" : "") + (c.discussed && c.id !== fid ? " discussed" : ""); if (isFac() && !S.present && c.id !== fid) { cls += " pickable"; extra = `data-act="focus" title="Discuss this topic"`; } }
  return `<article class="note cnote ${mine && !S.present ? "mine" : ""} ${isNew ? "pop" : ""} ${draggable ? "" : "static"} ${cls}" style="${base}" data-id="${c.id}" ${draggable ? 'data-drag="1"' : ""} ${extra}>
    ${c.theme && kids.length ? `<span class="theme">${esc(c.theme)}</span>` : ""}<p class="txt">${esc(c.text)}</p>${kidsH}
    ${k === "discuss" && c.discussed && c.id !== fid ? `<span class="donemark" aria-label="Discussed">✓</span>` : ""}
    <footer>${left}<span class="acts">${acts}</span></footer></article>`;
}

function boardScene(k) {
  if (k === "discuss") { S.rankMap = {}; ranked().forEach((x, i) => { S.rankMap[x.c.id] = { rank: i + 1, v: x.v }; }); }
  const mk = sess().method, LD = LAYOUTS[mk], m = method();
  if (!LD) return `<div class="board">${m.cols.map((c, i) => columnView(c, i, k)).join("")}</div>`;
  const W = canvasW(), L = sceneLayout(mk, W), pos = notePositions(L);
  let maxB = L.H0;
  for (const c of topCards()) { const p = pos[c.id]; if (p) maxB = Math.max(maxB, p.y + NOTE_H + 34 + childrenOf(c.id).length * 26); }
  const H = Math.round(maxB);
  const editable = canWrite() && !S.present && (k === "write" || k === "reveal");
  const zones = LD.zones.map((z, i) => {
    const col = m.cols.find(c => c[0] === z.k); if (!col) return "";
    const R = L.rects[z.k], lab = L.labs[z.k], pad = 30 * L.s, n = S.cards.filter(c => c.col === z.k).length;
    return `<div class="zone ${S.inlineNew && S.inlineNew.col === z.k ? "on" : ""}" data-z="${z.k}" ${editable ? `data-act="zoneclick" data-col="${z.k}" title="Click to stick a note on “${esc(col[1])}”"` : ""} style="left:${R.x - pad}px;top:${R.y - pad}px;width:${R.w + 2 * pad}px;height:${R.h + 2 * pad}px;--note:${zc(z)}"></div>
      <div class="zpill" style="left:${lab.x}px;top:${lab.y}px;--note:${zc(z)};--s:${i}"><span class="cicon" aria-hidden="true">${colIcon(z.k)}</span><span class="zt"><b>${esc(col[1])}</b><small>${esc(col[2])}</small></span><span class="count" title="Notes">${n}</span>${editable ? `<button class="zadd" data-act="zoneplus" data-col="${z.k}" aria-label="Add a note to ${esc(col[1])}">+</button>` : ""}</div>`;
  }).join("");
  const notes = topCards().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)).map((c, i) => pos[c.id] ? canvasNote(c, k, pos[c.id], i) : "").join("");
  return `<div class="canvas-wrap"><div class="canvas board-canvas bg-${LD.bg}" style="width:${W}px;height:${H}px" data-w="${W}">
    ${(DECO[LD.bg] || (() => ""))()}${sceneSVG(mk, "", `width="${W}" height="${L.H0}"`)}${zones}${notes}${inlineEditor(L)}</div></div>`;
}

function columnView([key, title, hint], i, k, inScene) {
  const tops = topCards().filter(c => c.col === key).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  const count = S.cards.filter(c => c.col === key).length;
  let notes;
  if (k === "write") {
    const mine = tops.filter(c => c.author === S.me), others = S.cards.filter(c => c.col === key && c.author !== S.me);
    notes = mine.map(c => noteView(c, k)).join("") + others.map(c => `<div class="note hidden ${S.cardsLoaded && !S.seen.has(c.id) ? "pop" : ""}" aria-label="Hidden note"><div class="bars"><i style="width:88%"></i><i style="width:62%"></i></div><small>A teammate's note</small></div>`).join("");
  } else {
    notes = tops.map(c => noteView(c, k)).join("");
  }
  const addable = (k === "write" || k === "reveal") && canWrite();
  const id = `new-${key}`;
  return `<section class="col" style="--note:var(--n${i % 5 + 1})${inScene ? `;grid-area:z-${key}` : ""}">
    <header>${colIcon(key) ? `<span class="cicon" aria-hidden="true">${colIcon(key)}</span>` : `<span class="badge" aria-hidden="true">${esc(title.replace(/^(House of |The )/, "").charAt(0))}</span>`}<div><h3>${esc(title)}</h3><p>${esc(hint)}</p></div><span class="count" title="Notes">${count}</span></header>
    ${notes || !addable ? `<div class="notes">${notes || `<div class="empty">No notes</div>`}</div>` : ""}
    ${addable ? `<div class="add"><textarea id="${id}" class="field" placeholder="One idea per note…" maxlength="500" data-add="${key}">${draft(id)}</textarea>
      <div class="row"><span class="hint">Enter to add · Shift+Enter for a new line</span><button class="btn sm primary" data-act="add" data-col="${key}">Add</button></div></div>` : ""}
  </section>`;
}

function noteView(c, k) {
  const mine = c.author === S.me;
  const kids = childrenOf(c.id);
  const isNew = S.cardsLoaded && !S.seen.has(c.id);
  const cls = ["note", mine ? "mine" : "", isNew ? "pop" : "", S.mergeSrc === c.id ? "sel" : "", S.mergeSrc && S.mergeSrc !== c.id ? "target" : ""].join(" ");
  if (S.editing === c.id) {
    const id = `edit-${c.id}`;
    return `<article class="${cls}" style="--note:${noteVar(c.col)}"><textarea id="${id}" maxlength="500" data-edit="${c.id}">${draft(id, c.text)}</textarea>
      <footer><span></span><span class="acts"><button class="nbtn" data-act="editcancel">Cancel</button><button class="nbtn strong" data-act="editsave" data-id="${c.id}">Save</button></span></footer></article>`;
  }
  const kidsH = kids.map(ch => `<div class="child"><p>${esc(ch.text)}</p>${k === "reveal" && canWrite() ? `<button class="nbtn" data-act="unmerge" data-id="${ch.id}">Ungroup</button>` : ""}</div>`).join("");
  let left = mine ? `<span class="tag">You</span>` : `<span></span>`;
  let acts = "";
  if ((k === "write" || k === "reveal") && mine && canWrite()) acts += `<button class="nbtn" data-act="edit" data-id="${c.id}">Edit</button><button class="nbtn" data-act="del" data-id="${c.id}">Delete</button>`;
  if (k === "reveal" && canWrite()) {
    if (!S.mergeSrc) acts += `<button class="nbtn" data-act="merge" data-id="${c.id}">Group</button>`;
    else if (S.mergeSrc !== c.id) acts += `<button class="nbtn strong" data-act="mergehere" data-id="${c.id}">Group here</button>`;
  }
  if (k === "vote") {
    const mv = myVotes()[c.id] || 0, max = sess().votesPerPerson || 3, rest = max - votesUsed();
    left = `<span class="votes"><button class="vbtn" data-act="vote" data-id="${c.id}" data-d="-1" aria-label="Remove a vote" ${mv > 0 && canWrite() ? "" : "disabled"}>−</button>
      <span class="dots" aria-label="${plural(mv, "vote")}">${Array.from({ length: mv }, () => "<i></i>").join("")}</span>
      <button class="vbtn" data-act="vote" data-id="${c.id}" data-d="1" aria-label="Add a vote" ${rest > 0 && canWrite() ? "" : "disabled"}>+</button></span>`;
    acts = mine ? `<span class="tag">You</span>` : "";
  }
  return `<article class="${cls}" style="--note:${noteVar(c.col)}" ${S.mergeSrc && S.mergeSrc !== c.id ? `data-act="mergehere" data-id="${c.id}"` : ""}>
    ${c.theme && kids.length ? `<span class="theme">${esc(c.theme)}</span>` : ""}<p class="txt">${esc(c.text)}</p>${kidsH}
    <footer>${left}<span class="acts">${acts}</span></footer></article>`;
}

function ranked() {
  return topCards().map(c => ({ c, v: totalVotes(c.id) })).sort((a, b) => b.v - a.v || (a.c.createdAt || 0) - (b.c.createdAt || 0));
}

function discussView(ph) {
  const list = ranked(), fid = sess().focusCardId;
  const idx = list.findIndex(x => x.c.id === fid), cur = idx >= 0 ? list[idx] : null;
  const now = cur ? `<div class="nowcard" style="--note:${noteVar(cur.c.col)}">
      <div class="nowtop"><span class="eyebrow">Now discussing · #${idx + 1}</span><span class="vtotal">${plural(cur.v, "vote")}</span><span class="tag">${esc(colName(cur.c.col))}</span></div>
      ${cur.c.theme && childrenOf(cur.c.id).length ? `<span class="theme">${esc(cur.c.theme)}</span>` : ""}<p class="txt">${esc(cur.c.text)}</p>
      ${childrenOf(cur.c.id).map(ch => `<div class="child"><p>${esc(ch.text)}</p></div>`).join("")}
      ${isFac() ? `<div class="nowacts"><button class="btn sm" data-act="nexttopic">Next topic →</button></div>` : ""}</div>`
    : `<div class="nowcard empty-now"><span class="eyebrow">Now discussing</span><p>${isFac() ? (list.length ? "Click a note on the board to discuss it, or start with the most voted one." : "No notes to discuss.") : "The facilitator will pick the first topic."}</p>${isFac() && list.length ? `<div class="nowacts"><button class="btn primary sm" data-act="nexttopic">Start with #1 →</button></div>` : ""}</div>`;
  return phaseHead(ph) + `<div class="discuss2">${now}
      <div class="panel"><h3 style="font-size:1.05rem;margin-bottom:10px">Add an action${cur ? " for this topic" : ""}</h3>${actionForm(cur ? cur.c.id : null)}${actionSuggest(cur ? cur.c.id : null)}
      <div style="margin-top:12px">${actionList(true)}</div></div></div>` + boardScene("discuss");
}

function actionForm(cardId) {
  if (!canWrite()) return "";
  return `<div class="actform">
    <div><label class="lbl" for="act-text">Action</label><input id="act-text" class="field" placeholder="e.g. Pair on code reviews for risky PRs" maxlength="300" value="${draft("act-text")}"></div>
    <div><label class="lbl" for="act-owner">Owner</label><input id="act-owner" class="field" placeholder="Name" maxlength="60" value="${draft("act-owner")}"></div>
    <div><label class="lbl" for="act-due">Due</label><input id="act-due" class="field" placeholder="Next sprint" maxlength="60" value="${draft("act-due")}"></div>
    <button class="btn primary" data-act="addaction" ${cardId ? `data-card="${cardId}"` : ""}>Add</button></div>`;
}

function actionList(compact) {
  const list = [...S.actions].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  if (!list.length) return `<div class="empty">No actions yet.</div>`;
  return `<ul class="alist">${list.map(a => `<li class="${a.done ? "done" : ""}">
    <input type="checkbox" id="chk-${a.id}" data-act="toggleaction" data-id="${a.id}" ${a.done ? "checked" : ""} ${canWrite() ? "" : "disabled"} aria-label="Mark as done">
    <span class="at">${esc(a.text)}</span>
    <span class="meta">${a.owner ? esc(a.owner) : "No owner"}${a.due ? " · " + esc(a.due) : ""}</span>
    ${canWrite() && !compact ? `<button class="btn sm ghost danger" data-act="delaction" data-id="${a.id}">Delete</button>` : ""}</li>`).join("")}</ul>`;
}

function actionsView(ph) {
  const top = ranked().slice(0, 5);
  return phaseHead(ph) + `${canWrite() ? `<div class="panel">${actionForm(null)}</div>` : ""}
    <div class="two"><div><div class="eyebrow" style="margin-bottom:10px">Actions · ${S.actions.length}</div>${actionList(false)}</div>
    <div><div class="eyebrow" style="margin-bottom:10px">Top voted topics</div>
      ${top.length ? `<ol class="rank">${top.map((x, i) => `<li style="--note:${noteVar(x.c.col)}"><span class="pos">${i + 1}</span><span class="sw"></span><span class="t">${esc(x.c.text)}</span><span class="v">${x.v}</span></li>`).join("")}</ol>` : `<div class="empty">No topics</div>`}</div></div>${reportPanel()}`;
}

function rotiView(ph) {
  const mine = S.roti[S.me] && S.roti[S.me].score;
  const scores = Object.values(S.roti).map(r => r.score).filter(n => n >= 1 && n <= 5);
  const n = scores.length, avg = n ? (scores.reduce((a, b) => a + b, 0) / n) : 0;
  const counts = [0, 0, 0, 0, 0, 0]; scores.forEach(s => counts[s]++);
  const maxC = Math.max(1, ...counts);
  return phaseHead(ph) + `<div class="roti">${ROTI.map(([v, l]) => `<button class="rbtn ${mine === v ? "sel" : ""}" data-act="roti" data-v="${v}" aria-pressed="${mine === v}" ${canWrite() ? "" : "disabled"}><b>${v}</b><span>${l}</span></button>`).join("")}</div>
    <div class="two"><div class="panel" style="display:flex;gap:26px;align-items:center;flex-wrap:wrap">
      <div><div class="big">${n ? avg.toFixed(1) : "–"}</div><div style="color:var(--muted);font-size:.85rem;font-weight:600">average out of 5 · ${plural(n, "vote")}</div></div>
      <div class="dist" style="flex:1;min-width:200px">${[5, 4, 3, 2, 1].map(v => `<span>${v}</span><span class="bar"><i style="width:${counts[v] / maxC * 100}%"></i></span><span class="n">${counts[v]}</span>`).join("")}</div></div>
    <div class="panel"><h3 style="font-size:1.1rem">Retro summary</h3><p style="color:var(--muted);font-size:.9rem;margin:6px 0 14px">Copy a summary (weather, voted topics, actions, ROTI) to paste into Slack, Confluence or an email.</p>
      <button class="btn primary" data-act="copy">Copy summary</button>
      <textarea id="summary-fallback" class="field" style="margin-top:12px;min-height:130px" readonly hidden></textarea></div></div>${reportPanel()}`;
}

function summary() {
  const s = sess(); const m = method();
  const lines = [`# ${sprintLabel(s)} · ${s.title || "Retro"}`, `Format: ${m.name} · ${new Date(s.createdAt || Date.now()).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" })}`, ""];
  const moods = Object.values(S.moods);
  if (moods.length) { lines.push("## Weather"); lines.push(WEATHER.map(([k, ico, nm]) => { const c = moods.filter(x => x.w === k).length; return c ? `${ico} ${nm}: ${c}` : null; }).filter(Boolean).join(" · ")); lines.push(""); }
  lines.push("## Topics (by votes)");
  ranked().forEach(x => {
    const col = (m.cols.find(c => c[0] === x.c.col) || [, "?"])[1];
    lines.push(`- [${col}] ${x.c.text.replace(/\n/g, " ")} (${plural(x.v, "vote")})`);
    childrenOf(x.c.id).forEach(ch => lines.push(`  - ${ch.text.replace(/\n/g, " ")}`));
  });
  lines.push("", "## Actions");
  if (!S.actions.length) lines.push("- None");
  [...S.actions].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)).forEach(a => lines.push(`- [${a.done ? "x" : " "}] ${a.text}${a.owner ? " — " + a.owner : ""}${a.due ? " (" + a.due + ")" : ""}`));
  const sc = Object.values(S.roti).map(r => r.score).filter(Boolean);
  if (sc.length) lines.push("", `## ROTI: ${(sc.reduce((a, b) => a + b, 0) / sc.length).toFixed(1)}/5 (${plural(sc.length, "vote")})`);
  return lines.join("\n");
}

/* ---------- presentation mode ---------- */
function presentView(ph) {
  const p = PHASES[ph], k = p.key, s = sess();
  const ppl = participants(), doneKey = `${S.bid}:${ph}`;
  const doneN = S.peers.filter(x => x.kind === "viewer" && x.presence && x.presence.done === doneKey).length;
  const pct = ppl.length ? Math.min(100, Math.round(doneN / ppl.length * 100)) : 0;
  let body = "";
  if (k === "checkin") {
    const counts = {}; Object.values(S.moods).forEach(m => { counts[m.w] = (counts[m.w] || 0) + 1; });
    const n = Object.keys(S.moods).length, max = Math.max(1, ...Object.values(counts));
    body = `<div class="pres-meter"><span><b>${n}</b>${n === 1 ? "answer" : "answers"} from ${ppl.length} online</span></div>
      <div class="weather">${WEATHER.map(([w, ico, nm]) => `<div class="wbtn"><span class="ico" aria-hidden="true">${ico}</span><span class="nm">${nm}</span><span class="bar"><i style="width:${(counts[w] || 0) / max * 100}%"></i></span><span class="ct">${counts[w] || 0}</span></div>`).join("")}</div>${followUp()}`;
  } else if (k === "write" || k === "reveal" || k === "vote") {
    const meter = k === "write" ? `<span><b>${doneN} / ${ppl.length}</b>done writing</span><span class="track"><i style="width:${pct}%"></i></span><span><b>${S.cards.length}</b>notes so far</span>`
      : k === "vote" ? `<span><b>${doneN} / ${ppl.length}</b>have voted</span><span class="track"><i style="width:${pct}%"></i></span><span>${plural(s.votesPerPerson || 3, "vote")} each</span>`
      : `<span><b>${S.cards.length}</b>notes on the wall</span>`;
    body = `<div class="pres-meter">${meter}</div>` + boardScene(k);
  } else if (k === "discuss") {
    const list = ranked(), fid = s.focusCardId, cur = list.find(x => x.c.id === fid);
    const acts = S.actions.filter(a => cur && a.cardId === cur.c.id);

/* ---------- timer ---------- */
function tick() {
  const el = document.getElementById("timer"); if (!el) return;
  const bar = document.getElementById("tbar");
  const end = sess() && sess().timerEnd;
  if (!end) { el.textContent = "--:--"; el.className = "timer idle"; if (bar) bar.style.width = "0"; return; }
  const ms = end - Date.now();
  const abs = Math.abs(ms), m = Math.floor(abs / 60000), s = Math.floor((abs % 60000) / 1000);
  const txt = `${ms < 0 ? "+" : ""}${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  if (ms <= 0) { el.textContent = "Time's up " + txt; el.className = "timer over"; }
  else { el.textContent = txt; el.className = "timer" + (ms < 30000 ? " low" : ""); }
  if (bar) {
    const dur = sess().timerDur || 0;
    bar.style.width = dur > 0 ? Math.max(0, Math.min(100, (1 - ms / dur) * 100)) + "%" : "0";
  }
}
setInterval(tick, 500);

/* ---------- confetti ---------- */
function confetti() {
  if (reduceMotion()) return;
  const cv = document.getElementById("confetti"); const ctx = cv.getContext && cv.getContext("2d"); if (!ctx) return;
  cv.hidden = false; cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--n1", "--n2", "--n3", "--n4", "--n5", "--pop", "--accent"].map(v => cs.getPropertyValue(v).trim() || "#ff4f8b");
  const P = Array.from({ length: 140 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 13 - 4, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3, w: 6 + Math.random() * 7, h: 8 + Math.random() * 9, c: cols[(Math.random() * cols.length) | 0] }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); });
    if (t - t0 < 3200) requestAnimationFrame(frame); else { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); cv.hidden = true; }
  })(t0);
}

/* ---------- actions ---------- */
async function setSession(patch) {
  if (!S.bid) return false;
  const next = { ...(sess() || {}), ...patch, updatedAt: Date.now() };
  delete next.id;
  return write(() => S.db.doc("retros/" + S.bid).set(next));
}

async function composeAdd() {
  const text = (S.drafts["compose"] || "").trim(), N = S.inlineNew;
  if (!N) return;
  if (!text || !canWrite()) { document.getElementById("compose")?.focus(); return; }
  const data = { text, col: N.col, author: S.me, createdAt: Date.now() };
  if (!N.auto) { data.x = N.x; data.y = N.y; }
  S.drafts["compose"] = ""; S.inlineNew = N.auto ? { col: N.col, auto: true } : null; schedule();
  const ok = await write(() => S.db.collection(path("cards")).add(data));
  if (!ok) { S.drafts["compose"] = text; S.inlineNew = N; schedule(); }
  if (S.inlineNew) setTimeout(() => document.getElementById("compose")?.focus({ preventScroll: true }), 40);
}

async function addCard(col) {
  const id = `new-${col}`;
  const text = (S.drafts[id] || "").trim();
  if (!text || !canWrite()) return;
  S.drafts[id] = ""; schedule();
  const ok = await write(() => S.db.collection(path("cards")).add({ text, col, author: S.me, createdAt: Date.now() }));
  if (!ok) { S.drafts[id] = text; schedule(); }
}

function goPhase(i) {
  i = Math.max(0, Math.min(PHASES.length - 1, i));
  S.mergeSrc = null; S.facOpen = false; S.inlineNew = null;
  setSession({ phase: i, timerEnd: null, timerDur: null });
}

function addVote(cid, d) {
  const max = sess().votesPerPerson || 3;
  const cur = { ...myVotes() };
  const used = Object.values(cur).reduce((a, b) => a + b, 0);
  if (d > 0 && used >= max) return;
  if (d < 0 && !(cur[cid] > 0)) return;
  cur[cid] = (cur[cid] || 0) + d;
  if (cur[cid] <= 0) delete cur[cid];
  S.pendingVotes = cur; schedule();
  S.voteInflight++;
  const ref = S.db.doc(path("votes/" + S.me));
  S.voteQueue = S.voteQueue.then(() => write(() => ref.set({ cards: cur, at: Date.now() }))).finally(() => {
    S.voteInflight--; if (S.voteInflight === 0) { S.pendingVotes = null; schedule(); }
  });
}

async function nextTopic() {
  const list = ranked();
  const fid = sess().focusCardId;
  if (fid) await write(() => S.db.doc(path("cards/" + fid)).update({ discussed: true }));
  const nxt = list.find(x => x.c.id !== fid && !x.c.discussed);
  setSession({ focusCardId: nxt ? nxt.c.id : null });

document.addEventListener("click", async e => {

    case "unmerge": write(() => S.db.doc(path("cards/" + id)).update({ parent: null })); break;
    case "vote": addVote(id, +el.dataset.d); break;
    case "done": if (S.room) { const me = S.peers.find(p => p.sameTab); const on = me && me.presence && me.presence.done === el.dataset.k; S.room.presence({ done: on ? null : el.dataset.k }).catch(() => {}); } break;
    case "focus": {
      const prev = sess().focusCardId;
      if (prev) write(() => S.db.doc(path("cards/" + prev)).update({ discussed: true }));
      setSession({ focusCardId: id }); break;
    }
    case "nexttopic": nextTopic(); break;
    case "aigroups": aiGroups(); break;
    case "aigroupapply": applyGroup(+el.dataset.i); break;
    case "aigroupskip": S.ai.groups = (S.ai.groups || []).filter((_, j) => j !== +el.dataset.i); schedule(); break;
    case "aigroupall": { const n = (S.ai.groups || []).length; for (let i = 0; i < n; i++) await applyGroup(0); toast("Notes grouped."); break; }
    case "aiact": aiActions(id); break;
    case "aiactuse": {
      const t = (S.ai.actions[id] || [])[+el.dataset.i]; if (!t) return;
      S.drafts["act-text"] = t; S.ai.actions[id] = S.ai.actions[id].filter((_, j) => j !== +el.dataset.i); schedule();
      setTimeout(() => document.getElementById("act-owner")?.focus(), 30); break;
    }
    case "aireport": aiReport(); break;
    case "aistop": if (S.ai.ctl) S.ai.ctl.abort(); break;
    case "aicopyreport": {
      const txt = (S.meta.report && S.meta.report.text) || "";
      try { await navigator.clipboard.writeText(txt); toast("Report copied."); }
      catch (_) { const ta = document.getElementById("report-fallback"); if (ta) { ta.hidden = false; ta.value = txt; ta.select(); } toast("Select the text below and copy it."); }
      break;
    }
    case "addaction": {
      const text = (S.drafts["act-text"] || "").trim(); if (!text) { document.getElementById("act-text")?.focus(); return; }
      const owner = (S.drafts["act-owner"] || "").trim(), due = (S.drafts["act-due"] || "").trim();
      S.drafts["act-text"] = ""; S.drafts["act-owner"] = ""; S.drafts["act-due"] = ""; schedule();
      write(() => S.db.collection(path("actions")).add({ text, owner, due, done: false, cardId: el.dataset.card || null, createdAt: Date.now(), by: S.me }));
      break;
    }
    case "toggleaction": { const a = S.actions.find(x => x.id === id); if (a) write(() => S.db.doc(path("actions/" + id)).update({ done: !a.done })); break; }
    case "delaction": write(() => S.db.doc(path("actions/" + id)).delete()); break;
    case "copy": {
      const txt = summary();
      try { await navigator.clipboard.writeText(txt); toast("Summary copied."); }
      catch (_) { const ta = document.getElementById("summary-fallback"); if (ta) { ta.hidden = false; ta.value = txt; ta.select(); } toast("Select the text below and copy it."); }
      break;
    }
  }
});

/* ---------- drag & drop on the canvas ---------- */
let drag = null;
document.addEventListener("pointerdown", e => {
  const n = e.target.closest(".cnote[data-drag]");
  if (!n || e.button > 0 || e.target.closest("button,textarea,input,a")) return;
  const canvas = n.closest(".canvas"); if (!canvas) return;
  const cr = canvas.getBoundingClientRect(), nr = n.getBoundingClientRect();
  drag = { id: n.dataset.id, el: n, canvas, cr, ox: e.clientX - nr.left, oy: e.clientY - nr.top, sx: e.clientX, sy: e.clientY, moved: false, pid: e.pointerId, target: null };
  S.holdUntil = Date.now() + 10 * 60e3;
});
document.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.pid) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 5) return;
  if (!drag.moved) { drag.moved = true; drag.el.classList.add("dragging"); try { drag.el.setPointerCapture(drag.pid); } catch (_) {} }
  e.preventDefault();
  const cr = drag.canvas.getBoundingClientRect();
  const x = Math.max(0, Math.min(cr.width - NOTE_W, e.clientX - cr.left - drag.ox)), y = Math.max(0, e.clientY - cr.top - drag.oy);
  drag.el.style.left = x + "px"; drag.el.style.top = y + "px"; drag.x = x; drag.y = y;
  const L = sceneLayout(sess().method, +drag.canvas.dataset.w || canvasW());
  const z = zoneAt(L, x + NOTE_W / 2, y + 30);
  drag.canvas.querySelectorAll(".zone").forEach(el => el.classList.toggle("on", el.dataset.z === z));
  let tgt = null;
  if (phase() >= 0 && PHASES[phase()].key === "reveal") {
    const px = x + NOTE_W / 2, py = y + 24;
    drag.canvas.querySelectorAll(".cnote[data-id]").forEach(n => {
      if (n === drag.el) return;
      const l = n.offsetLeft, t = n.offsetTop;
      if (px >= l - 6 && px <= l + n.offsetWidth + 6 && py >= t - 6 && py <= t + n.offsetHeight + 6) tgt = n;
    });
  }
  if (drag.target && drag.target !== tgt) drag.target.classList.remove("droptarget");
  if (tgt) tgt.classList.add("droptarget");
  drag.target = tgt;
}, { passive: false });
async function endDrag(e) {
  if (!drag || (e && e.pointerId !== drag.pid)) return;
  const d = drag; drag = null;
  if (!d.moved) { S.holdUntil = 0; return; }
  const W = +d.canvas.dataset.w || canvasW(), L = sceneLayout(sess().method, W);
  if (d.target) {
    const tid = d.target.dataset.id;
    S.cards = S.cards.map(c => c.id === d.id || c.parent === d.id ? { ...c, parent: tid } : c);
    S.holdUntil = 0; schedule();
    for (const ch of S.cards.filter(c => c.parent === tid && c.id !== d.id)) await write(() => S.db.doc(path("cards/" + ch.id)).update({ parent: tid }));
    await write(() => S.db.doc(path("cards/" + d.id)).update({ parent: tid }));
    toast("Grouped.");
    return;
  }
  const col = zoneAt(L, d.x + NOTE_W / 2, d.y + 30);
  const patch = { x: +(d.x / W).toFixed(4), y: +(d.y / W).toFixed(4), col };
  S.cards = S.cards.map(c => c.id === d.id ? { ...c, ...patch } : c);
  S.holdUntil = 0; schedule();
  write(() => S.db.doc(path("cards/" + d.id)).update(patch));
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", e => { if (drag && e.pointerId === drag.pid) { drag = null; S.holdUntil = 0; schedule(); } });
window.addEventListener("resize", () => { if (document.querySelector(".canvas-wrap")) schedule(); });

/* ---------- data ---------- */
function openRetro(bid, data) {
  if (bid === S.bid) return;
  const r = bid ? (S.retros.find(x => x.id === bid) || data || null) : null;
  if (bid && r) transition(0, { eyebrow: sprintLabel(r), title: r.title || "Retro", num: r.sprint || "", ill: ILL[r.method] });
  else if (!bid) transition(0, { eyebrow: "Retro Live", title: "All retros", ill: ILL.reveal });
  subscribeBoard(bid);
  S.session = r; S.viewPhase = null; S.lastPhase = null; S.confirmReset = false; S.present = false; S.view = null; S.menu = null;
  S.shownPh = phase();
  if (S.room) S.room.presence({ bid: bid || null, done: null }).catch(() => {});
}

function subscribeBoard(bid) {
  S.subs.forEach(u => { try { u(); } catch (_) {} });
  S.subs = []; S.cards = []; S.votes = {}; S.moods = {}; S.roti = {}; S.actions = []; S.meta = {}; S.prevActions = [];
  S.ai = { groups: null, groupsBusy: false, actions: {}, actBusy: null, reportBusy: false, reportLive: "", ctl: null, err: {} };
  S.bid = bid; S.mergeSrc = null; S.editing = null; S.pendingVotes = null; S.seen = new Set(); S.cardsLoaded = false;
  if (!bid) return;
  const onErr = e => { if (e && e.code !== "revoked") toast("Live sync stopped. Reload the page."); };
  const listOf = q => q.docs.map(d => ({ id: d.id, ...d.data() }));
  const mapOf = q => { const m = {}; q.docs.forEach(d => { m[d.id] = d.data(); }); return m; };
  S.subs.push(S.db.collection(path("cards")).onSnapshot(q => {
    S.cards = listOf(q);
    if (!S.cardsLoaded) { S.cards.forEach(c => S.seen.add(c.id)); S.cardsLoaded = true; }
    schedule();
  }, onErr));
  S.subs.push(S.db.collection(path("votes")).onSnapshot(q => { S.votes = mapOf(q); schedule(); }, onErr));
  S.subs.push(S.db.collection(path("moods")).onSnapshot(q => { S.moods = mapOf(q); schedule(); }, onErr));
  S.subs.push(S.db.collection(path("roti")).onSnapshot(q => { S.roti = mapOf(q); schedule(); }, onErr));
  S.subs.push(S.db.collection(path("actions")).onSnapshot(q => { S.actions = listOf(q); schedule(); }, onErr));
  S.subs.push(S.db.collection(path("meta")).onSnapshot(q => { S.meta = mapOf(q); schedule(); }, onErr));
  const cur = S.retros.find(r => r.id === bid);
  const pr = cur ? S.retros.filter(r => r.id !== bid && (r.createdAt || 0) < (cur.createdAt || 0)).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))[0] : null;
  if (pr) S.subs.push(S.db.collection(`boards/${pr.id}/actions`).onSnapshot(q => { S.prevActions = listOf(q); schedule(); }, onErr));
}

async function init() {
  const use = n => (window.claude && typeof window.claude.use === "function") ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [db, user, room, sample] = await Promise.all([use("db"), use("user"), use("room"), use("sample")]);
  S.db = db; S.user = user; S.room = room; S.sample = sample;
  if (!db) { S.status = "nodb"; schedule(); return; }
  S.me = user ? await user.id() : null;
  if (user && S.me) { try { const cw = await user.can("data.write"); if (cw === false) S.readOnly = true; } catch (_) {} }
  S.status = "ready";
  S.isOwner = user ? await user.isOwner().catch(() => false) : false;
  db.collection("retros").onSnapshot(q => {
    S.retros = q.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!S.retrosLoaded) {
      S.retrosLoaded = true;
      const live = liveRetros()[0];
      if (live) { subscribeBoard(live.id); if (S.room) S.room.presence({ bid: live.id }).catch(() => {}); }
    }
    const r = S.bid ? S.retros.find(x => x.id === S.bid) : null;
    if (S.bid && !r) {
      if (!(S.session && S.session.createdAt > Date.now() - 10000)) { subscribeBoard(null); S.session = null; toast("That retro was deleted."); }
    } else S.session = r || null;
    const nph = phase();
    if (S.bid && S.shownPh !== undefined && S.shownPh >= 0 && nph !== S.shownPh && !(isDone() && S.viewPhase != null)) transition(nph);
    S.shownPh = nph;
    schedule();
  }, () => toast("Couldn't load the retros. Reload the page."));
  if (room) {
    room.onPeers(ch => { S.peers = ch.peers; if (Date.now() - S.bootAt > 5000 && ch.joined.length) announce(ch.joined); schedule(); });
    room.presence({ uid: S.me || null, bid: S.bid || null }).catch(() => {});
  }
  schedule();
}
playIntro();
init();
})();
</script>
